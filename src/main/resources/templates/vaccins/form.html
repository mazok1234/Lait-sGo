<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{index :: layout(~{::mainContent})}">

<head>
    <title>Historique Vaccin</title>
</head>

<body>

    <div th:fragment="mainContent" class="page-content">

        <div class="page-header">
            <h1 class="page-title">Nouvelle vaccination</h1>
        </div>

        <div class="card" style="max-width:600px;margin:0 auto;">

            <div class="card-header">
                <h2 class="card-title">Informations de la vaccination</h2>
            </div>

            <div class="card-body" style="padding:24px;">

                <div th:if="${success}" class="flash flash-success">
                    <i class="fas fa-check-circle"></i>
                    <span th:text="${success}"></span>
                </div>

                <form th:action="@{/vaccins/historique/save}" method="post"
                    style="display:flex;flex-direction:column;gap:16px;">

                    <div style="display:flex;flex-direction:column;gap:6px;">
                        <label for="vacheId" style="font-size:0.875rem;font-weight:600;">
                            Vache
                        </label>

                        <select id="vacheId" name="vacheId" required
                            style="padding:10px;border:1px solid #D1D5DB;border-radius:6px;width:100%;background:white;">
                            <option value="">-- Sélectionner une vache --</option>

                            <option th:each="v : ${vaches}" th:value="${v.id}" th:text="${v.numeroBoucle}">
                            </option>
                        </select>
                    </div>

                    <div style="display:flex;flex-direction:column;gap:6px;">
                        <label for="protocoleId" style="font-size:0.875rem;font-weight:600;">
                            Vaccin
                        </label>

                        <select id="protocoleId" name="protocoleId" required
                            style="padding:10px;border:1px solid #D1D5DB;border-radius:6px;width:100%;background:white;">
                            <option value="">-- Sélectionner un vaccin --</option>

                            <option th:each="p : ${protocoles}" th:value="${p.idProtocoleVaccin}"
                                th:text="${p.nomVaccin}">
                            </option>
                        </select>
                    </div>

                    <div style="display:flex;flex-direction:column;gap:6px;">
                        <label for="dateVaccination" style="font-size:0.875rem;font-weight:600;">
                            Date de vaccination
                        </label>

                        <input type="date" id="dateVaccination" name="dateVaccination" required
                            style="padding:10px;border:1px solid #D1D5DB;border-radius:6px;width:100%;">
                    </div>

                    <div style="display:flex;flex-direction:column;gap:6px;">
                        <label for="typeInjection" style="font-size:0.875rem;font-weight:600;">
                            Type d'injection
                        </label>

                        <select id="typeInjection" name="typeInjection" required
                            style="padding:10px;border:1px solid #D1D5DB;border-radius:6px;width:100%;background:white;">
                            <option value="INTRAMUSCULAIRE">Intramusculaire</option>
                            <option value="SOUS_CUTANEE">Sous-cutanée</option>
                        </select>
                    </div>

                    <div style="display:flex;justify-content:space-between;margin-top:12px;">

                        <a th:href="@{/vaccins}" class="btn"
                            style="border:1px solid #D1D5DB;background:white;color:#1A1A2E;">
                            Retour
                        </a>

                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i>
                            Enregistrer
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
