<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{index :: layout(~{::mainContent})}">
<head>
    <title th:text="${evenementForm.id != null ? 'Modifier un traitement' : 'Nouveau traitement'}">Nouveau traitement</title>
</head>
<body>
<div th:fragment="mainContent" class="page-content">

    <div class="page-header">
        <h1 class="page-title" th:text="${evenementForm.id != null ? 'Modifier un traitement' : 'Nouveau traitement'}">Nouveau traitement</h1>
        <p class="page-subtitle">Enregistrer un traitement de santé pour une vache</p>
    </div>

    <div class="card" style="max-width:900px;margin:0 auto;">
        <div class="card-header">
            <h2 class="card-title" th:text="${evenementForm.id != null ? 'Edition du traitement' : 'Saisie du traitement'}">Saisie du traitement</h2>
        </div>

        <div class="card-body" style="padding:28px;">

            <div th:if="${erreur}" style="background:#FEE2E2;color:#DC2626;padding:12px;border-radius:6px;margin-bottom:16px;" th:text="${erreur}"></div>

            <form th:action="@{/traitements/save}" th:object="${evenementForm}" method="post"
                  style="display:flex;flex-direction:column;gap:18px;">

                <input type="hidden" th:field="*{id}">

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                    <div style="display:flex;flex-direction:column;gap:6px;">
                        <label style="font-size:0.875rem;font-weight:600;">Vache</label>
                        <select th:field="*{vacheId}"
                                style="padding:10px;border:1px solid #D1D5DB;border-radius:6px;background:white;width:100%;">
                            <option value="">-- Sélectionner une vache --</option>
                            <option th:each="v : ${vaches}" th:value="${v.id}" th:text="${v.numeroBoucle}"></option>
                        </select>
                    </div>

                    <div style="display:flex;flex-direction:column;gap:6px;">
                        <label style="font-size:0.875rem;font-weight:600;">Maladie</label>
                        <select th:field="*{maladieId}"
                                style="padding:10px;border:1px solid #D1D5DB;border-radius:6px;background:white;width:100%;">
                            <option value="">-- Sélectionner une maladie --</option>
                            <option th:each="m : ${maladies}" th:value="${m.id}" th:text="${m.nom}"></option>
                        </select>
                    </div>
                </div>

                <div style="display:grid;grid-template-columns:1fr 220px;gap:16px;">
                    <div style="display:flex;flex-direction:column;gap:6px;">
                        <label style="font-size:0.875rem;font-weight:600;">Description</label>
                        <textarea th:field="*{description}"
                                  style="padding:10px;border:1px solid #D1D5DB;border-radius:6px;width:100%;"></textarea>
                    </div>
                    <div style="display:flex;flex-direction:column;gap:6px;">
                        <label style="font-size:0.875rem;font-weight:600;">Date de l'événement</label>
                        <input type="date" th:field="*{dateEvenement}"
                               style="padding:10px;border:1px solid #D1D5DB;border-radius:6px;width:100%;">
                    </div>
                </div>

                <hr>
                <h3 style="margin:0;">Médicaments utilisés</h3>

                <div id="lignes-container" style="display:flex;flex-direction:column;gap:14px;">
                    <div class="ligne-traitement" th:each="ligne, stat : *{lignes}"
                         style="display:grid;grid-template-columns:1.5fr 0.7fr 0.8fr 0.6fr 0.8fr 0.8fr 1fr auto;gap:8px;align-items:end;border:1px solid #E5E7EB;padding:12px;border-radius:8px;">

                        <input type="hidden" th:field="*{lignes[__${stat.index}__].id}">

                        <div style="display:flex;flex-direction:column;gap:4px;">
                            <label style="font-size:0.75rem;font-weight:600;">Médicament</label>
                            <select th:field="*{lignes[__${stat.index}__].medicamentId}"
                                    style="padding:8px;border:1px solid #D1D5DB;border-radius:6px;">
                                <option value="">-- Médicament --</option>
                                <option th:each="med : ${medicaments}" th:value="${med.id}"
                                        th:text="${med.nom + ' - ' + med.prixUnitaire + ' Ar'}"></option>
                            </select>
                        </div>

                        <div style="display:flex;flex-direction:column;gap:4px;">
                            <label style="font-size:0.75rem;font-weight:600;">Nbr</label>
                            <input type="number" min="1" th:field="*{lignes[__${stat.index}__].nbrMedicament}"
                                   style="padding:8px;border:1px solid #D1D5DB;border-radius:6px;">
                        </div>

                        <div style="display:flex;flex-direction:column;gap:4px;">
                            <label style="font-size:0.75rem;font-weight:600;">Dose</label>
                            <input type="number" step="0.01" min="0.01" th:field="*{lignes[__${stat.index}__].dose}"
                                   style="padding:8px;border:1px solid #D1D5DB;border-radius:6px;">
                        </div>

                        <div style="display:flex;flex-direction:column;gap:4px;">
                            <label style="font-size:0.75rem;font-weight:600;">Unité</label>
                            <input type="text" th:field="*{lignes[__${stat.index}__].unite}" placeholder="ml, g..."
                                   style="padding:8px;border:1px solid #D1D5DB;border-radius:6px;">
                        </div>

                        <div style="display:flex;flex-direction:column;gap:4px;">
                            <label style="font-size:0.75rem;font-weight:600;">Durée (j)</label>
                            <input type="number" min="1" th:field="*{lignes[__${stat.index}__].dureeTraitement}"
                                   style="padding:8px;border:1px solid #D1D5DB;border-radius:6px;">
                        </div>

                        <div style="display:flex;flex-direction:column;gap:4px;">
                            <label style="font-size:0.75rem;font-weight:600;">Délai attente (j)</label>
                            <input type="number" min="0" th:field="*{lignes[__${stat.index}__].delaiAttenteJ}"
                                   style="padding:8px;border:1px solid #D1D5DB;border-radius:6px;">
                        </div>

                        <div style="display:flex;flex-direction:column;gap:4px;">
                            <label style="font-size:0.75rem;font-weight:600;">Date début</label>
                            <input type="date" th:field="*{lignes[__${stat.index}__].dateDebut}"
                                   style="padding:8px;border:1px solid #D1D5DB;border-radius:6px;">
                        </div>

                        <button type="button" class="btn-remove-ligne"
                                style="border:1px solid #DC2626;color:#DC2626;background:transparent;border-radius:6px;padding:8px;">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>

                <button type="button" id="btn-add-ligne" class="btn" style="align-self:flex-start;border:1px dashed #9CA3AF;">
                    + Ajouter un médicament
                </button>

                <div style="display:flex;justify-content:space-between;margin-top:8px;">
                    <a th:href="@{/traitements}" class="btn" style="border:1px solid #D1D5DB;background:white;color:#1A1A2E;">
                        Annuler
                    </a>
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- template caché pour cloner une nouvelle ligne -->
    <template id="ligne-template">
        <div class="ligne-traitement" style="display:grid;grid-template-columns:1.5fr 0.7fr 0.8fr 0.6fr 0.8fr 0.8fr 1fr auto;gap:8px;align-items:end;border:1px solid #E5E7EB;padding:12px;border-radius:8px;">
            <input type="hidden" name="lignes[INDEX].id">

            <div style="display:flex;flex-direction:column;gap:4px;">
                <label style="font-size:0.75rem;font-weight:600;">Médicament</label>
                <select name="lignes[INDEX].medicamentId" style="padding:8px;border:1px solid #D1D5DB;border-radius:6px;">
                    <option value="">-- Médicament --</option>
                    <option th:each="med : ${medicaments}" th:value="${med.id}"
                            th:text="${med.nom + ' - ' + med.prixUnitaire + ' Ar'}"></option>
                </select>
            </div>
            <div style="display:flex;flex-direction:column;gap:4px;">
                <label style="font-size:0.75rem;font-weight:600;">Nbr</label>
                <input type="number" min="1" name="lignes[INDEX].nbrMedicament" style="padding:8px;border:1px solid #D1D5DB;border-radius:6px;">
            </div>
            <div style="display:flex;flex-direction:column;gap:4px;">
                <label style="font-size:0.75rem;font-weight:600;">Dose</label>
                <input type="number" step="0.01" min="0.01" name="lignes[INDEX].dose" style="padding:8px;border:1px solid #D1D5DB;border-radius:6px;">
            </div>
            <div style="display:flex;flex-direction:column;gap:4px;">
                <label style="font-size:0.75rem;font-weight:600;">Unité</label>
                <input type="text" name="lignes[INDEX].unite" placeholder="ml, g..." style="padding:8px;border:1px solid #D1D5DB;border-radius:6px;">
            </div>
            <div style="display:flex;flex-direction:column;gap:4px;">
                <label style="font-size:0.75rem;font-weight:600;">Durée (j)</label>
                <input type="number" min="1" name="lignes[INDEX].dureeTraitement" style="padding:8px;border:1px solid #D1D5DB;border-radius:6px;">
            </div>
            <div style="display:flex;flex-direction:column;gap:4px;">
                <label style="font-size:0.75rem;font-weight:600;">Délai attente (j)</label>
                <input type="number" min="0" name="lignes[INDEX].delaiAttenteJ" style="padding:8px;border:1px solid #D1D5DB;border-radius:6px;">
            </div>
            <div style="display:flex;flex-direction:column;gap:4px;">
                <label style="font-size:0.75rem;font-weight:600;">Date début</label>
                <input type="date" name="lignes[INDEX].dateDebut" style="padding:8px;border:1px solid #D1D5DB;border-radius:6px;">
            </div>
            <button type="button" class="btn-remove-ligne" style="border:1px solid #DC2626;color:#DC2626;background:transparent;border-radius:6px;padding:8px;">
                <i class="fas fa-trash"></i>
            </button>
        </div>
    </template>

    <script th:inline="javascript">
        let index = /*[[${evenementForm.lignes.size()}]]*/ 1;

        document.getElementById('btn-add-ligne').addEventListener('click', function () {
            const template = document.getElementById('ligne-template').innerHTML;
            const html = template.replaceAll('INDEX', index);
            document.getElementById('lignes-container').insertAdjacentHTML('beforeend', html);
            index++;
        });

        document.getElementById('lignes-container').addEventListener('click', function (e) {
            const btn = e.target.closest('.btn-remove-ligne');
            if (btn) {
                btn.closest('.ligne-traitement').remove();
            }
        });
    </script>
</div>
</body>
</html>
