<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{index :: layout(~{::mainContent})}">
<head>
    <title>Nouvelle production</title>
</head>
<body>
<div th:fragment="mainContent" class="page-content">

    <div class="page-header">
        <h1 class="page-title">Nouvelle production</h1>
        <p class="page-subtitle">Enregistrer une production de lait</p>
    </div>

    <div class="cheptel-wrapper">
        <div class="card">
            <div class="card-header">
                <span class="card-title"><i class="fas fa-chart-bar" style="margin-right:8px;color:#007AFF;"></i> Informations de la production</span>
            </div>
            <div class="card-body">
                <form th:action="@{/productions/enregistrer}" th:object="${production}" method="post" class="form-grid">

                    <div class="form-group">
                        <label>Vache</label>
                        <select th:field="*{vache}" required>
                            <option value="">Sélectionner une vache</option>
                            <option th:each="v : ${vaches}" th:value="${v.id}" th:text="${v.numeroBoucle}">Vache</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Quantité (L)</label>
                        <input type="number" step="0.01" th:field="*{quantiteLitres}" required placeholder="ex: 24.5">
                    </div>

                    <div class="form-group">
                        <label>Date de production</label>
                        <input type="date" th:field="*{dateProduction}" required>
                    </div>

                    <div class="form-group full-width">
                        <div class="form-actions">
                            <a th:href="@{/productions}" class="btn btn-outline">Annuler</a>
                            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Enregistrer</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>
</body>
</html>
