<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ajouter une Production</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div class="container form-container">
        <div class="page-header">
            <h2 class="page-title">📝 Enregistrer une Production</h2>
        </div>

        <form th:action="@{/production/enregistrer}" th:object="${production}" method="post">
            <div class="form-group">
                <label>Code de la Vache <span class="required">*</span></label>
                <input type="text" th:field="*{codeVache}" required placeholder="ex: FR0001">
            </div>

            <div class="form-group">
                <label>Nom de la Vache</label>
                <input type="text" th:field="*{nomVache}" placeholder="ex: Bella">
            </div>

            <div class="form-group-row">
                <div class="form-group">
                    <label>Quantité (Litres) <span class="required">*</span></label>
                    <input type="number" step="0.01" th:field="*{quantite}" required placeholder="ex: 24.5">
                </div>
                <div class="form-group">
                    <label>Période <span class="required">*</span></label>
                    <select th:field="*{periode}">
                        <option value="Matin">Matin</option>
                        <option value="Soir">Soir</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Date de Production <span class="required">*</span></label>
                <input type="date" th:field="*{dateProduction}" required>
            </div>

            <div class="form-group-row">
                <div class="btn-group" style="width: 100%;">
                    <button type="submit" class="btn btn-success" style="flex: 1; justify-content: center;">Enregistrer</button>
                    <a th:href="@{/production}" class="btn btn-cancel" style="flex: 1; justify-content: center; text-decoration: none; text-align: center; line-height: 20px;">Annuler</a>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
