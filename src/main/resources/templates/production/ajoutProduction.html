<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{index :: layout(~{::mainContent})}">
<head>
    <title th:text="${mode == 'edit'} ? 'Modifier une production' : 'Nouvelle production'">Nouvelle production</title>
</head>
<body>
<div th:fragment="mainContent" class="page-content">

    <div class="page-header">
        <h1 class="page-title" th:text="${mode == 'edit'} ? 'Modifier une production' : 'Nouvelle production'">Nouvelle production</h1>
        <p class="page-subtitle">Enregistrer une production de lait</p>
    </div>

    <div class="cheptel-wrapper">
        <div class="card">
            <div class="card-header">
                <span class="card-title"><i class="fas fa-chart-bar" style="margin-right:8px;color:#007AFF;"></i> Informations de la production</span>
            </div>
            <div class="card-body">
                <div th:if="${errorMessage}" class="card"
                     style="padding:12px 16px;margin-bottom:1.2rem;border:1px solid #f6c6c0;background:#fce8e6;color:#b34033;"
                     th:text="${errorMessage}"></div>

                <form th:action="${mode == 'edit'} ? @{'/productions/' + ${productionId} + '/edit'} : @{/productions/enregistrer}" th:object="${production}" method="post" class="form-grid">

                    <div class="form-group">
                        <label>Vache</label>
                        <select th:field="*{vache}" required>
                            <option value="">Sélectionner une vache</option>
                            <option th:each="v : ${vaches}" th:value="${v.id}" th:text="${v.numeroBoucle}">Vache</option>
                        </select>
                        <small style="color:#62748c;">Seules les vaches en lactation sont proposées.</small>
                    </div>

                    <div class="form-group">
                        <label>Quantité matin (L)</label>
                        <input type="number" step="0.01" min="0" th:field="*{quantiteMatin}" placeholder="ex: 12.5">
                    </div>

                    <div class="form-group">
                        <label>Quantité soir (L)</label>
                        <input type="number" step="0.01" min="0" th:field="*{quantiteSoir}" placeholder="ex: 11.0">
                    </div>

                    <div class="form-group">
                        <label>Date de production</label>
                        <input type="date" th:field="*{dateProduction}" required>
                    </div>

                    <div class="form-group full-width">
                        <div class="form-actions">
                            <a th:href="@{/productions}" class="btn btn-outline">Annuler</a>
                            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Enregistrer</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>
</body>
</html>
