<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{index :: layout(~{::mainContent})}">
<head>
    <title>Nouvelle vente</title>
</head>
<body>
<div th:fragment="mainContent" class="page-content">

    <div class="page-header">
        <h1 class="page-title">Nouvelle vente</h1>
        <p class="page-subtitle">Enregistrer une vente de lait</p>
    </div>

    <div th:if="${success}" class="flash flash-success" style="margin-bottom:20px;">
        <i class="fas fa-check-circle"></i> Vente enregistrée.
        <a th:href="@{/vente/{id}/excel(id=${lastVenteId})}" class="btn btn-sm" style="margin-left:12px;">
            <i class="fas fa-file-excel"></i> Télécharger le fichier excel 
        </a>
    </div>

    <div th:if="${error}" class="flash flash-error" style="margin-bottom:20px;">
        <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
    </div>

    <div class="cheptel-wrapper">
        <div class="card">
            <div class="card-header">
                <div class="card-title">Informations de la vente</div>
            </div>
            <div class="card-body">
                <form th:action="@{/vente}" th:object="${vente}" method="post" class="form-grid">

                    <div class="form-group">
                        <label>Date de vente</label>
                        <input type="date" th:field="*{dateVente}" required>
                        <span th:if="${#fields.hasErrors('dateVente')}" th:errors="*{dateVente}" class="error-message"></span>
                    </div>

                    <div class="form-group">
                        <label>Quantité (L)</label>
                        <input type="number" step="0.01" min="0.01" th:field="*{quantiteLait}" required>
                        <span th:if="${#fields.hasErrors('quantiteLait')}" th:errors="*{quantiteLait}" class="error-message"></span>
                    </div>

                    <div class="form-group">
                        <label>Prix unitaire (Ar/L)</label>
                        <input type="number" step="0.01" min="0.01" max="9999.99" th:field="*{prixUnitaire}" required>
                        <span th:if="${#fields.hasErrors('prixUnitaire')}" th:errors="*{prixUnitaire}" class="error-message"></span>
                    </div>

                    <div class="form-group full-width">
                        <div class="form-actions">
                            <a th:href="@{/vente/liste}" class="btn btn-outline">Annuler</a>
                            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Enregistrer</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>
</body>
</html>
