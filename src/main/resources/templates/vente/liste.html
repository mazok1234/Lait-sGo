<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{index :: layout(~{::mainContent})}">
<head>
    <title>Liste des ventes</title>
</head>
<body>
<div th:fragment="mainContent" class="page-content">

    <div class="page-header">
        <h1 class="page-title">Liste des ventes</h1>
        <p class="page-subtitle">Gestion des ventes (lait, engrais, viande, vache, veau)</p>
    </div>

    <div class="card card-table">
        <div class="card-header filters" style="justify-content:space-between;gap:12px;flex-wrap:wrap;">
            <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                <a th:href="@{/vente/liste(order='asc', min=${min}, max=${max}, produitId=${produitId})}"
                   th:classappend="${order == 'asc'} ? ' active'" class="btn btn-sm" style="border:1px solid #D1D5DB;">
                    <i class="fas fa-arrow-up"></i> Date ↑
                </a>
                <a th:href="@{/vente/liste(order='desc', min=${min}, max=${max}, produitId=${produitId})}"
                   th:classappend="${order == 'desc'} ? ' active'" class="btn btn-sm" style="border:1px solid #D1D5DB;">
                    <i class="fas fa-arrow-down"></i> Date ↓
                </a>
                <form method="get" th:action="@{/vente/liste}" style="display:flex;align-items:center;gap:8px;">
                    <input type="hidden" name="order" th:value="${order}"/>
                    <input type="number" name="min" placeholder="Min" th:value="${min}"
                           style="padding:8px 12px;border:1px solid #D1D5DB;border-radius:6px;width:100px;font-family:'Inter',sans-serif;font-size:0.85rem;">
                    <input type="number" name="max" placeholder="Max" th:value="${max}"
                           style="padding:8px 12px;border:1px solid #D1D5DB;border-radius:6px;width:100px;font-family:'Inter',sans-serif;font-size:0.85rem;">
                    <select name="produitId"
                            style="padding:8px 12px;border:1px solid #D1D5DB;border-radius:6px;font-family:'Inter',sans-serif;font-size:0.85rem;">
                        <option value="">Tous les produits</option>
                        <option th:each="produit : ${produits}"
                                th:value="${produit.id}"
                                th:text="${produit.libelle}"
                                th:selected="${produitId != null and produitId == produit.id}">
                        </option>
                    </select>
                    <input type="hidden" name="page" value="0"/>
                    <button type="submit" class="btn btn-primary btn-sm"><i class="fas fa-filter"></i> Filtrer</button>
                </form>
            </div>
            <a th:href="@{/vente/nouveau}" class="btn btn-primary">
                <i class="fas fa-plus"></i> Nouvelle vente
            </a>
        </div>

        <div class="card-body">
            <table class="table">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Produit</th>
                    <th>Quantité</th>
                    <th>Prix unitaire</th>
                    <th>Montant</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="vente : ${page.content}">
                    <td th:text="${vente.dateVente}">2024-01-01</td>
                    <td th:text="${vente.produit != null ? vente.produit.libelle : '-'}">Lait</td>
                    <td th:text="${vente.quantite + ' ' + (vente.produit != null ? vente.produit.uniteDefaut : '')}">0</td>
                    <td th:text="${vente.prixUnitaire + ' Ar'}">0 Ar</td>
                    <td><strong th:text="${vente.prixUnitaire.multiply(vente.quantite) + ' Ar'}">0 Ar</strong></td>
                </tr>
                <tr th:if="${#lists.isEmpty(page.content)}">
                    <td colspan="5" class="text-center" style="padding:32px;color:#9CA3AF;">
                        Aucune vente enregistrée.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination" th:if="${page.totalPages > 1}">
            <a th:if="${!page.first}"
               th:href="@{/vente/liste(page=${page.number-1}, min=${min}, max=${max}, produitId=${produitId}, order=${order})}"
               class="btn btn-sm" style="border:1px solid #D1D5DB;">
                <i class="fas fa-chevron-left"></i> Précédent
            </a>
            <span class="page-info" th:text="'Page ' + (${page.number} + 1) + ' / ' + ${page.totalPages}">Page 1</span>
            <a th:if="${!page.last}"
               th:href="@{/vente/liste(page=${page.number+1}, min=${min}, max=${max}, produitId=${produitId}, order=${order})}"
               class="btn btn-sm" style="border:1px solid #D1D5DB;">
                Suivant <i class="fas fa-chevron-right"></i>
            </a>
        </div>
    </div>

</div>
</body>
</html>
