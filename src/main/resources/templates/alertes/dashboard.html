<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{index :: layout(~{::mainContent})}">
<head><title>Alertes</title></head>
<body>
<div th:fragment="mainContent">

  <div class="page-header">
    <h1 class="page-title">Alertes</h1>
    <p class="page-subtitle">Surveillance centralisée du troupeau</p>
  </div>

  <!-- Messages flash -->
  <div th:if="${succes}" style="
    background:#E8F5E9;color:#2E7D32;padding:12px 20px;border-radius:8px;
    margin-bottom:20px;font-size:0.875rem;font-weight:500;display:flex;align-items:center;gap:8px;">
    <i class="fas fa-check-circle"></i>
    <span th:text="${succes}"></span>
  </div>
  <div th:if="${erreur}" style="
    background:#FFEBEE;color:#C62828;padding:12px 20px;border-radius:8px;
    margin-bottom:20px;font-size:0.875rem;font-weight:500;display:flex;align-items:center;gap:8px;">
    <i class="fas fa-exclamation-circle"></i>
    <span th:text="${erreur}"></span>
  </div>

  <!-- KPIs -->
  <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);">

    <div class="card" style="display:flex;align-items:center;gap:16px;padding:20px;">
      <div class="card-icon" style="background-color:#FEECEC;color:#DC2626;width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;flex-shrink:0;">
        <i class="fas fa-exclamation-triangle"></i>
      </div>
      <div>
        <div class="card-label">DANGER</div>
        <div class="card-value" th:text="${kpis['danger'] ?: 0}">0</div>
      </div>
    </div>

    <div class="card" style="display:flex;align-items:center;gap:16px;padding:20px;">
      <div class="card-icon" style="background-color:#FFF7ED;color:#F59E0B;width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;flex-shrink:0;">
        <i class="fas fa-exclamation-circle"></i>
      </div>
      <div>
        <div class="card-label">WARNING</div>
        <div class="card-value" th:text="${kpis['warning'] ?: 0}">0</div>
      </div>
    </div>

    <div class="card" style="display:flex;align-items:center;gap:16px;padding:20px;">
      <div class="card-icon" style="background-color:#EFF6FF;color:#007AFF;width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;flex-shrink:0;">
        <i class="fas fa-info-circle"></i>
      </div>
      <div>
        <div class="card-label">INFO</div>
        <div class="card-value" th:text="${kpis['info'] ?: 0}">0</div>
      </div>
    </div>

  </div>

  <!-- Tableau -->
  <div class="card card-table">

    <!-- Barre de recherche + filtres niveau -->
    <div class="filters" style="justify-content:space-between;gap:12px;flex-wrap:wrap;">
      <input type="text" id="searchInput" placeholder="Rechercher..."
             class="filter-search" oninput="filterTable(this,'alertesTable')"/>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
        <a th:href="@{/alertes}" class="btn"
           th:classappend="${niveauActif == null ? ' btn-primary' : ''}">Tous</a>
        <a th:each="n : ${niveaux}"
           th:href="@{/alertes(niveau=${n.code})}"
           th:text="${n.libelle}"
           class="btn"
           th:classappend="${niveauActif == n.code ? ' btn-primary' : ''}">Niveau</a>
      </div>
    </div>

    <!-- Filtres type -->
    <div class="filters" style="gap:6px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px;">
      <span class="filter-label" style="margin-right:4px;">Type :</span>
      <a th:href="@{/alertes}" class="btn btn-sm"
         th:classappend="${typeActif == null ? ' btn-primary' : ''}">Tous types</a>
      <a th:each="t : ${types}"
         th:href="@{/alertes(type=${t.id})}"
         th:text="${t.libelle}"
         class="btn btn-sm"
         th:classappend="${typeActif == t.id ? ' btn-primary' : ''}">Type</a>
    </div>

    <!-- Tableau -->
    <div class="card-body">
      <table class="table" id="alertesTable">
        <thead>
          <tr>
            <th>Niveau</th>
            <th>Titre</th>
            <th>Concerne</th>
            <th>Reçue</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="alerte : ${alertes}">

            <td>
              <!-- Badge coloré selon le niveau -->
              <span th:if="${alerte.niveauCode == 'danger'}"
                    style="display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;font-size:0.75rem;font-weight:600;background:#FEECEC;color:#DC2626;">
                <i class="fas fa-exclamation-triangle" style="font-size:0.7rem;"></i>
                <span th:text="${alerte.niveauLibelle}"></span>
              </span>
              <span th:if="${alerte.niveauCode == 'warning'}"
                    style="display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;font-size:0.75rem;font-weight:600;background:#FFF7ED;color:#F59E0B;">
                <i class="fas fa-exclamation-circle" style="font-size:0.7rem;"></i>
                <span th:text="${alerte.niveauLibelle}"></span>
              </span>
              <span th:if="${alerte.niveauCode == 'info'}"
                    style="display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;font-size:0.75rem;font-weight:600;background:#EFF6FF;color:#007AFF;">
                <i class="fas fa-info-circle" style="font-size:0.7rem;"></i>
                <span th:text="${alerte.niveauLibelle}"></span>
              </span>
            </td>

            <td th:text="${alerte.titre}" style="font-weight:500;">Titre</td>

            <td>
              <a th:if="${alerte.vacheId != null}"
                 th:href="@{/cheptel/{id}(id=${alerte.vacheId})}"
                 th:text="${alerte.vacheBoucle != null ? alerte.vacheBoucle : 'Vache #' + alerte.vacheId}"
                 style="color:#007AFF;font-weight:500;">
              </a>
              <span th:if="${alerte.vacheId == null}"
                    style="color:#9CA3AF;font-size:0.85rem;display:flex;align-items:center;gap:4px;">
                <i class="fas fa-warehouse"></i> Alerte ferme
              </span>
            </td>

            <td style="color:#6B7280;font-size:0.85rem;"
                th:text="${#temporals.format(alerte.createdAt, 'dd/MM/yyyy HH:mm')}">Date</td>

            <td>
              <a th:href="@{/alertes/{id}(id=${alerte.id})}" class="btn btn-primary btn-sm">
                <i class="fas fa-eye"></i> Voir
              </a>
            </td>

          </tr>

          <!-- État vide -->
          <tr th:if="${alertes.isEmpty()}" class="empty-row">
            <td colspan="5">
              <div class="empty-state">
                <i class="fas fa-check-circle" style="color:#059669;opacity:0.4;"></i>
                <p>Aucune alerte active pour le moment</p>
              </div>
            </td>
          </tr>

        </tbody>
      </table>
    </div>
  </div>

</div>
</body>
</html>
