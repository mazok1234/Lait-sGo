<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{index :: layout(~{::mainContent})}">
<head><title>Alertes</title></head>
<body>
<div th:fragment="mainContent" class="page-content">

  <div class="page-header">
    <h1 class="page-title">Alertes</h1>
    <p class="page-subtitle">Surveillance centralisée du troupeau</p>
  </div>

  <!-- Messages flash -->
  <div th:if="${succes}" class="flash flash-success">
    <i class="fas fa-check-circle"></i>
    <span th:text="${succes}"></span>
  </div>
  <div th:if="${erreur}" class="flash flash-error">
    <i class="fas fa-exclamation-circle"></i>
    <span th:text="${erreur}"></span>
  </div>

  <!-- KPIs dynamiques (depuis BDD) -->
  <div class="stats-grid stats-grid-3">
    <div th:each="niveau : ${niveaux}" class="card kpi-card">
      <div class="card-icon">
        <i class="fas"
           th:classappend="${
              niveau.code == 'urgent'
                ? ' fa-exclamation-triangle icon-danger'
                : (niveau.code == 'attention'
                    ? ' fa-exclamation-circle icon-warning'
                    : ' fa-info-circle icon-info')
           }">
        </i>
      </div>
      <div>
        <div class="card-label" th:text="${niveau.libelle}">Niveau</div>
        <div class="card-value" th:text="${kpis[niveau.code] ?: 0}">0</div>
      </div>
    </div>
  </div>

  <!-- Tableau principal -->
  <div class="card card-table">

    <!-- Barre de recherche + filtres -->
    <div class="filters filters-between">

      <!-- Recherche texte -->
      <input type="text" id="searchInput"
             placeholder="Rechercher par titre, module, niveau, date…"
             class="filter-search"
             oninput="alertesApp.applyFilters()"/>

      <!-- Liste déroulante module (sans doublons — depuis getTypesDisponibles()) -->
      <div class="filter-group-inline">
        <label for="moduleFilter" class="filter-label">Module</label>
        <select id="moduleFilter" class="form-select"
                onchange="alertesApp.onModuleChange(this.value)">
          <option value="" th:selected="${typeActif == null}">Tous les modules</option>
          <option th:each="t : ${types}"
                  th:value="${t['code']}"
                  th:text="${t['module']}"
                  th:selected="${typeActif == t['code']}">
          </option>
        </select>
      </div>

      <!-- Filtres niveau (boutons) -->
      <div class="filter-group-inline">
        <button class="btn btn-primary" id="btn-niveau-all"
                onclick="alertesApp.setNiveau(null, this)">Tous</button>
        <button th:each="n : ${niveaux}"
                th:id="'btn-niveau-' + ${n.code}"
                th:text="${n.libelle}"
                class="btn"
                th:attr="onclick='alertesApp.setNiveau(\'' + ${n.code} + '\', this)'">Niveau</button>
      </div>

    </div>

    <!-- Tableau -->
    <div class="card-body">
      <table class="table" id="alertesTable">
        <thead>
          <tr>
            <th class="sortable" onclick="alertesApp.sortBy('niveau')" data-col="niveau">
              Niveau <i class="fas fa-sort"></i>
            </th>
            <th class="sortable" onclick="alertesApp.sortBy('titre')" data-col="titre">
              Titre <i class="fas fa-sort"></i>
            </th>
            <th>Module</th>
            <th class="sortable" onclick="alertesApp.sortBy('date')" data-col="date">
              Reçue <i class="fas fa-sort"></i>
            </th>
            <th>Statut</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="alertesBody">

          <tr th:each="alerte : ${alertes}"
              th:classappend="${alerte.acquittee ? 'row-acquittee' : 'row-niveau-' + alerte.niveauCode}"
              th:data-niveau="${alerte.niveauCode}"
              th:data-niveau-label="${alerte.niveauLibelle}"
              th:data-type="${alerte.typeAlerte}"
              th:data-type-label="${alerte.moduleSource}"
              th:data-titre="${alerte.titre}"
              th:data-date="${alerte.createdAt}"
              th:data-module="${alerte.moduleSource}"
              th:data-acquittee="${alerte.acquittee}">

            <!-- Niveau -->
            <td>
              <!-- Si acquittée — badge grisé -->
              <span th:if="${alerte.acquittee}"
                    class="badge badge-niveau"
                    style="opacity:0.45;">
                <i class="fas fa-check"></i>
                <span th:text="${alerte.niveauLibelle}"></span>
              </span>
              <!-- Si non acquittée — badge coloré -->
              <span th:if="${!alerte.acquittee}"
                    class="badge badge-niveau"
                    th:classappend="${
                        alerte.niveauCode == 'urgent'
                          ? ' badge-niveau-danger'
                          : (alerte.niveauCode == 'attention'
                              ? ' badge-niveau-warning'
                              : ' badge-niveau-info')
                    }">
                <i class="fas"
                   th:classappend="${
                       alerte.niveauCode == 'urgent'
                         ? ' fa-exclamation-triangle'
                         : (alerte.niveauCode == 'attention'
                             ? ' fa-exclamation-circle'
                             : ' fa-info-circle')
                   }">
                </i>
                <span th:text="${alerte.niveauLibelle}"></span>
              </span>
            </td>

            <!-- Titre -->
            <td class="cell-titre"
                th:text="${alerte.titre}"
                th:style="${alerte.acquittee ? 'opacity:0.55;' : ''}">Titre</td>

            <!-- Module source -->
            <td class="cell-module"
                th:text="${alerte.moduleSource}"
                th:style="${alerte.acquittee ? 'opacity:0.55;' : ''}">Module</td>

            <!-- Date de réception -->
            <td class="cell-date"
                th:text="${#temporals.format(alerte.createdAt, 'dd/MM/yyyy HH:mm')}"
                th:style="${alerte.acquittee ? 'opacity:0.55;' : ''}">Date</td>

            <!-- Statut acquittement -->
            <td>
              <span th:if="${alerte.acquittee}"
                    style="font-size:0.75rem;font-weight:600;color:#6B7280;
                           display:inline-flex;align-items:center;gap:4px;">
                <i class="fas fa-check-circle" style="color:#059669;"></i> Acquittée
              </span>
              <span th:if="${!alerte.acquittee}"
                    style="font-size:0.75rem;font-weight:600;color:#F59E0B;
                           display:inline-flex;align-items:center;gap:4px;">
                <i class="fas fa-clock"></i> Active
              </span>
            </td>

            <!-- Action -->
            <td>
              <a th:href="@{/alertes/{id}(id=${alerte.id})}"
                 class="btn btn-primary btn-sm">
                <i class="fas fa-eye"></i> Voir
              </a>
            </td>

          </tr>
        </tbody>
      </table>

      <!-- État vide -->
      <div th:if="${alertes.isEmpty()}" class="empty-state">
        <i class="fas fa-check-circle" style="color:#059669;opacity:0.4;"></i>
        <p>Aucune alerte pour le moment</p>
      </div>

      <!-- Aucun résultat filtre JS -->
      <div id="noResult" class="no-result" style="display:none;">
        <i class="fas fa-search"></i>
        <p>Aucune alerte ne correspond à vos critères</p>
      </div>
    </div>

    <!-- Pagination -->
    <div class="pagination" id="paginationBar">
      <button class="btn" id="btnPrev" onclick="alertesApp.prevPage()" disabled>
        <i class="fas fa-chevron-left"></i> Précédent
      </button>
      <span class="page-info" id="pageInfo">Page 1</span>
      <button class="btn" id="btnNext" onclick="alertesApp.nextPage()">
        Suivant <i class="fas fa-chevron-right"></i>
      </button>
    </div>

  </div>

  <script th:inline="none">
  (function () {
    const alertesApp = window.alertesApp = {};

    let allRows     = [];
    let filtered    = [];
    let currentPage = 1;
    const pageSize  = 10;
    let sortCol     = null;
    let sortAsc     = true;
    let activeNiveau = null;

    document.addEventListener('DOMContentLoaded', function () {
      const tbody = document.getElementById('alertesBody');
      if (!tbody) return;
      allRows = Array.from(tbody.querySelectorAll('tr'));
      if (allRows.length === 0) return;
      applyAll();
    });

    alertesApp.applyFilters   = function () { applyAll(); };
    alertesApp.prevPage       = function () { if (currentPage > 1) { currentPage--; render(); } };
    alertesApp.nextPage       = function () {
      const total = Math.ceil(filtered.length / pageSize);
      if (currentPage < total) { currentPage++; render(); }
    };

    alertesApp.setNiveau = function (code, btn) {
      activeNiveau = code;
      highlightBtn('btn-niveau-all', btn, 'btn-niveau-');
      applyAll();
    };

    alertesApp.onModuleChange = function (code) {
      const q = code ? '?type=' + encodeURIComponent(code) : '';
      window.location.href = '/alertes' + q;
    };

    alertesApp.sortBy = function (col) {
      if (sortCol === col) { sortAsc = !sortAsc; }
      else { sortCol = col; sortAsc = true; }
      updateSortIcons();
      applyAll();
    };

    function applyAll() {
      const query = (document.getElementById('searchInput').value || '').toLowerCase().trim();

      filtered = allRows.filter(function (row) {
        // Les acquittées sont toujours affichées (en bas), pas filtrées par niveau
        const acquittee = row.dataset.acquittee === 'true';
        if (activeNiveau && !acquittee && row.dataset.niveau !== activeNiveau) return false;

        if (!query) return true;

        const champs = [
          row.dataset.titre, row.dataset.niveau, row.dataset.niveauLabel,
          row.dataset.type, row.dataset.typeLabel, row.dataset.date, row.dataset.module
        ].map(s => (s || '').toLowerCase());

        return champs.some(s => s.includes(query));
      });

      if (sortCol) {
        filtered.sort(function (a, b) {
          let va = '', vb = '';
          if (sortCol === 'niveau') { va = a.dataset.niveau; vb = b.dataset.niveau; }
          if (sortCol === 'titre')  { va = a.dataset.titre;  vb = b.dataset.titre; }
          if (sortCol === 'date')   { va = a.dataset.date;   vb = b.dataset.date; }
          if (va < vb) return sortAsc ? -1 : 1;
          if (va > vb) return sortAsc ?  1 : -1;
          return 0;
        });
      }

      currentPage = 1;
      render();
    }

    function render() {
      const tbody = document.getElementById('alertesBody');
      const noResult = document.getElementById('noResult');
      const paginationBar = document.getElementById('paginationBar');

      allRows.forEach(r => r.style.display = 'none');

      if (filtered.length === 0) {
        noResult.style.display = 'flex';
        paginationBar.style.display = 'none';
        return;
      }
      noResult.style.display = 'none';

      const totalPages = Math.ceil(filtered.length / pageSize);
      if (currentPage > totalPages) currentPage = totalPages;

      const start = (currentPage - 1) * pageSize;
      const end   = Math.min(start + pageSize, filtered.length);

      filtered.forEach(function (row, idx) {
        if (idx >= start && idx < end) {
          row.style.display = '';
          tbody.appendChild(row);
        }
      });

      document.getElementById('pageInfo').textContent =
          'Page ' + currentPage + ' / ' + totalPages +
          ' (' + filtered.length + ' alerte' + (filtered.length > 1 ? 's' : '') + ')';
      document.getElementById('btnPrev').disabled = (currentPage === 1);
      document.getElementById('btnNext').disabled = (currentPage === totalPages);
      paginationBar.style.display = totalPages <= 1 ? 'none' : 'flex';
    }

    function highlightBtn(allBtnId, clickedBtn, prefix) {
      document.querySelectorAll('[id^="' + prefix + '"]').forEach(b => b.classList.remove('btn-primary'));
      const allBtn = document.getElementById(allBtnId);
      if (allBtn) allBtn.classList.remove('btn-primary');
      if (clickedBtn) clickedBtn.classList.add('btn-primary');
      else if (allBtn) allBtn.classList.add('btn-primary');
    }

    function updateSortIcons() {
      document.querySelectorAll('.sortable').forEach(th => {
        const col = th.dataset.col;
        const icon = th.querySelector('i');
        if (!icon) return;
        icon.className = col === sortCol
            ? (sortAsc ? 'fas fa-sort-up' : 'fas fa-sort-down')
            : 'fas fa-sort';
      });
    }
  })();
  </script>

</div>
</body>
</html>
