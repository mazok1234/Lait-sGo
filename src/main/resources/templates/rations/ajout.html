<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{index :: layout(~{::mainContent})}">
<head><title>Ajout ration</title></head>
<body>
<div th:fragment="mainContent" class="page-content">

    <div class="page-header">
        <h1 class="page-title">Ajout ration</h1>
        <p class="page-subtitle">Creer une ration pour un stade physiologique</p>
    </div>

    <div class="card" style="max-width:540px;margin:0 auto;">
        <div class="card-header">
            <h2 class="card-title">Nouvelle ration</h2>
        </div>

        <div class="card-body" style="padding:28px;">
            <form th:action="@{/rations/save}" th:object="${ration}" method="post"
                  style="display:flex;flex-direction:column;gap:18px;">

                <div style="display:flex;flex-direction:column;gap:6px;">
                    <label for="nom" style="font-size:0.875rem;font-weight:600;">Nom</label>
                    <input id="nom" type="text" th:field="*{nom}" placeholder="ex: Lactation haute"
                           style="padding:10px;border:1px solid #D1D5DB;border-radius:6px;width:100%;">
                    <span th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"
                          style="color:#DC2626;font-size:0.8rem;"></span>
                </div>

                <div style="display:flex;flex-direction:column;gap:6px;">
                    <label for="idPhaseLactation" style="font-size:0.875rem;font-weight:600;">Phase de lactation disponible</label>
                    <select id="idPhaseLactation" th:field="*{idPhaseLactation}"
                            style="padding:10px;border:1px solid #D1D5DB;border-radius:6px;background:white;width:100%;">
                        <option value="">-- Selectionner une phase --</option>
                        <option th:each="s : ${stades}" th:value="${s.id}"
                                th:text="${s.libelle + ' (jours ' + s.jourMin + ' a ' + s.jourMax + ')'}"></option>
                    </select>
                    <small style="color:#6B7280;font-size:0.8rem;">
                        Une seule ration par phase. jour min = premier jour en lait, jour max = dernier jour en lait de la phase.
                    </small>
                    <span th:if="${#fields.hasErrors('idPhaseLactation')}" th:errors="*{idPhaseLactation}"
                          style="color:#DC2626;font-size:0.8rem;"></span>
                </div>

                <div style="display:flex;justify-content:flex-end;margin-top:8px;">
                    <button type="button" class="btn btn-secondary" onclick="window.history.back();">
                        <i class="fas fa-times"></i> Annuler
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-check"></i> Valider
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
