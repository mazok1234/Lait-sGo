<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{index :: layout(~{::mainContent})}">
<head><title>Détails ration</title></head>
<body>
<div th:fragment="mainContent" class="page-content">

    <div class="page-header">
        <h1 class="page-title" th:text="${ration.nom}">Ration</h1>
        <p class="page-subtitle" th:text="${phase}">Phase de lactation</p>
    </div>

    <div class="content-grid" style="grid-template-columns: 1fr 1fr; gap: 20px;">

        <!-- Colonne 1 : Composition de la ration -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">
                    <i class="fas fa-utensils"></i> Composition de la ration
                </h2>
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                    <tr>
                        <th>Aliment</th>
                        <th style="text-align:center;">Quantité</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="ligne : ${aliments}">
                        <td th:text="${ligne.aliment != null ? ligne.aliment.nom : '-'}">-</td>
                        <td style="text-align:center;" th:text="${#numbers.formatDecimal(ligne.quantiteKg,1,2) + ' kg'}">0 kg</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(aliments)}">
                        <td colspan="2" class="text-center" style="padding:32px;color:#9CA3AF;">
                            Aucun aliment dans cette ration.
                        </td>
                    </tr>
                    </tbody>
                </table>

                <div style="margin-top:16px;padding:12px;background:#F0FDF4;border-radius:6px;border:1px solid #86EFAC;">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <span style="font-weight:600;color:#166534;">Coût journalier :</span>
                        <span style="font-weight:700;color:#059669;" th:text="${'Ar ' + #numbers.formatDecimal(nutrition.coutTotalAr,1,2)}">0 Ar</span>
                    </div>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;">
                        <span style="font-weight:600;color:#166534;">UFL total :</span>
                        <span style="font-weight:700;color:#059669;" th:text="${#numbers.formatDecimal(nutrition.uflTotal,1,2)}">0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Colonne 2 : Vaches concernées -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">
                    <i class="fas fa-cow"></i> Vaches concernées
                    <span class="badge badge-primary" th:text="${vaches.size()}">0</span>
                </h2>
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                    <tr>
                        <th>Boucle</th>
                        <th>Jours en lait</th>
                        <th style="text-align:center;">Phase</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="v : ${vaches}">
                        <td th:text="${v.numeroBoucle}">V001</td>
                        <td th:text="${v.joursEnLait}">45</td>
                        <td style="text-align:center;">
                            <span class="badge" th:class="${v.phaseActuelle == 'Lactation haute' ? 'badge-success' : 
                                                              v.phaseActuelle == 'Lactation moyenne' ? 'badge-info' : 
                                                              v.phaseActuelle == 'Lactation basse' ? 'badge-warning' : 'badge-secondary'}"
                                  th:text="${v.phaseActuelle}">Phase</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(vaches)}">
                        <td colspan="3" class="text-center" style="padding:32px;color:#9CA3AF;">
                            Aucune vache dans cette phase actuellement.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div style="margin-top:20px;">
        <a th:href="@{/rations}" class="btn" style="border:1px solid #D1D5DB;background:white;color:#1A1A2E;">
            <i class="fas fa-arrow-left"></i> Retour aux rations
        </a>
    </div>

</div>
</body>
</html>
