<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{index :: layout(~{::mainContent})}">
<head><title>Rations</title></head>
<body>
<div th:fragment="mainContent" class="page-content">

    <div class="page-header">
        <h1 class="page-title">Rations</h1>
        <p class="page-subtitle">Rations journalieres par stade physiologique</p>
    </div>

    <div th:if="${successMessage}" class="card"
         style="padding:12px 16px;margin-bottom:12px;border:1px solid #86EFAC;background:#F0FDF4;color:#166534;"
         th:text="${successMessage}"></div>

    <div class="content-grid" style="grid-template-columns: 1fr 2fr; align-items:start;">
        <div class="card" style="padding:18px; display:flex; flex-direction:column; gap:12px;">
            <a th:href="@{/rations/new}" class="btn btn-primary" style="justify-content:center;">
                <i class="fas fa-plus"></i> Nouvelle ration
            </a>

            <div th:if="${#lists.isEmpty(rations)}" class="text-center" style="padding:24px;color:#9CA3AF;">
                Aucune ration trouvee.
            </div>

            <a th:each="r : ${rations}"
               th:href="@{/rations(rationId=${r.id})}"
               class="btn"
               th:style="${rationSelectionnee != null and rationSelectionnee.id == r.id} ?
                         'display:block;text-align:left;border:1px solid #007AFF;background:#EFF6FF;color:#007AFF;padding:10px 12px;' :
                         'display:block;text-align:left;border:1px solid #D1D5DB;background:#FFFFFF;color:#1A1A2E;padding:10px 12px;'">
                <div style="display:flex;flex-direction:column;gap:4px;line-height:1.25;">
                    <div style="display:flex;gap:6px;align-items:center;">
                        <span style="font-size:0.74rem;opacity:.75;min-width:58px;">Ration:</span>
                        <strong th:text="${r.nom}" style="font-size:0.9rem;">Lactation haute</strong>
                    </div>
                    <div style="display:flex;gap:6px;align-items:center;">
                        <span style="font-size:0.74rem;opacity:.75;min-width:58px;">Phase:</span>
                        <span th:text="${r.stade}" style="font-size:0.82rem;">Lactation haute</span>
                    </div>
                    <div style="display:flex;gap:6px;align-items:center;">
                        <span style="font-size:0.74rem;opacity:.75;min-width:58px;">Vaches:</span>
                        <span th:text="${r.nbVaches}" style="font-size:0.82rem;">0</span>
                    </div>
                </div>
            </a>
        </div>

        <div class="card" th:if="${rationSelectionnee != null}">
            <div class="card-header" style="display:block;">
                <h2 class="card-title" th:text="${rationSelectionnee.nom}">Ration</h2>
                <p style="margin-top:4px;color:#6B7280;font-size:0.88rem;"
                   th:text="${'UFL total ' + #numbers.formatDecimal(nutrition.uflTotal,1,2) + ' - cout ' + #numbers.formatDecimal(nutrition.coutTotalAr,1,2) + ' Ar / jour'}">
                    UFL total
                </p>
                <div style="margin-top:10px;display:flex;justify-content:flex-end;gap:8px;">
                    <a th:href="@{/rations/details/{id}(id=${rationSelectionnee.id})}"
                       class="btn btn-sm" style="border:1px solid #007AFF;color:#007AFF;">
                        <i class="fas fa-eye"></i> Détails
                    </a>
                    <a th:href="@{/rations/edit/{id}(id=${rationSelectionnee.id})}"
                       class="btn btn-sm" style="border:1px solid #6B7280;color:#6B7280;">
                        <i class="fas fa-pen"></i> Modifier ration
                    </a>
                    <a th:href="@{/rations/delete/{id}(id=${rationSelectionnee.id})}"
                       class="btn btn-sm" style="border:1px solid #DC2626;color:#DC2626;"
                       onclick="return confirm('Supprimer cette ration et sa composition ?');">
                        <i class="fas fa-trash"></i> Supprimer ration
                    </a>
                </div>
            </div>

            <div class="card-body">
                <table class="table">
                    <thead>
                    <tr>
                        <th>Aliment</th>
                        <th>Quantite</th>
                        <th style="text-align:center;">Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="ligne : ${rationAliments}">
                        <td th:text="${ligne.aliment != null ? ligne.aliment.nom : '-'}">-</td>
                        <td th:text="${#numbers.formatDecimal(ligne.quantiteKg,1,2) + ' kg'}">0 kg</td>
                        <td style="text-align:center;">
                            <a th:href="@{/rations/aliments/delete/{id}(id=${ligne.id},rationId=${rationSelectionnee.id})}"
                               class="btn btn-sm" style="border:1px solid #DC2626;color:#DC2626;"
                               onclick="return confirm('Supprimer cet aliment de la ration ?');">
                                <i class="fas fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(rationAliments)}">
                        <td colspan="3" class="text-center" style="padding:32px;color:#9CA3AF;">
                            Aucun aliment dans cette ration.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div style="padding:16px 24px;border-top:1px solid #F0EEF0;display:flex;justify-content:flex-end;">
                <a th:href="@{/rations/aliments/new(rationId=${rationSelectionnee.id})}" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Ajouter
                </a>
            </div>
        </div>
    </div>

</div>
</body>
</html>
