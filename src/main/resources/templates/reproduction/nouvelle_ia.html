<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{index :: layout(~{::mainContent})}">
<head>
    <title>Nouvelle insémination</title>
</head>
<body>
<div th:fragment="mainContent" class="page-content">

    <div class="page-header">
        <h1 class="page-title">Nouvelle insémination</h1>
        <p class="page-subtitle">Enregistrer une insémination artificielle</p>
    </div>

    <div th:if="${success}" class="flash flash-success" style="margin-bottom:20px;">
        <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="flash flash-error" style="margin-bottom:20px;">
        <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
    </div>

    <div class="cheptel-wrapper">
        <div class="card">
            <div class="card-header">
                <span class="card-title">Informations de l'IA</span>
            </div>
            <div class="card-body">
                <form th:action="@{/reproduction/enregistrer}" method="post" class="form-grid">

                    <div class="form-group">
                        <label>Vache</label>
                        <select id="vacheId" name="vacheId" required>
                            <option value="">-- Sélectionner --</option>
                            <option th:each="v : ${vaches}"
                                    th:value="${v.id}"
                                    th:text="${v.numeroBoucle} + ' - ' + ${v.race.libelle}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Date d'IA</label>
                        <input type="date" id="dateIA" name="dateIA" required>
                    </div>

                    <div class="form-group">
                        <label>Type d'IA</label>
                        <input type="text" id="typeInjection" name="typeInjection" placeholder="ex: IA fraîche">
                    </div>

                    <div class="form-group">
                        <label>Semence</label>
                        <input type="text" id="semence" name="semence" placeholder="Référence" required>
                    </div>

                    <div class="form-group">
                        <label>Inséminateur</label>
                        <input type="text" id="inseminateur" name="inseminateur" placeholder="Nom" required>
                    </div>

                    <div class="form-group full-width">
                        <div class="form-actions">
                            <a th:href="@{/reproduction/en-attente}" class="btn btn-outline">Annuler</a>
                            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Enregistrer</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>
</body>
</html>
