<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{index :: layout(~{::mainContent})}">
<head>
    <title>Historique des inséminations</title>
</head>
<body>
<div th:fragment="mainContent" class="page-content">

    <div class="page-header">
        <h1 class="page-title" th:text="${vache != null ? 'Historique IA – ' + vache.numeroBoucle : 'Historique IA'}">Historique IA</h1>
        <p class="page-subtitle">Suivi des inséminations d'une vache</p>
    </div>

    <div th:if="${success}" class="flash flash-success" style="margin-bottom:20px;">
        <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="flash flash-error" style="margin-bottom:20px;">
        <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
    </div>

    <div class="card" th:if="${vache != null}" style="margin-bottom:20px;">
        <div class="card-body" style="display:flex;gap:32px;flex-wrap:wrap;">
            <div><strong>Race :</strong> <span th:text="${vache.race.libelle}"></span></div>
            <div><strong>Date de naissance :</strong> <span th:text="${vache.dateNaissance}"></span></div>
            <div><strong>Poids :</strong> <span th:text="${vache.poidsKg} + ' kg'"></span></div>
        </div>
    </div>

    <div class="card card-table">
        <div class="card-header">
            <span class="card-title">Inséminations</span>
        </div>
        <div class="card-body">
            <table class="table">
                <thead>
                <tr>
                    <th>Date d'IA</th>
                    <th>Semence</th>
                    <th>Type d'IA</th>
                    <th>Inséminateur</th>
                    <th>Statut</th>
                    <th style="text-align:center;">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="ia : ${historique}">
                    <td th:text="${ia.dateIA}">-</td>
                    <td th:text="${ia.semence}">-</td>
                    <td th:text="${ia.typeInjection}">-</td>
                    <td th:text="${ia.inséminateur}">-</td>
                    <td>
                        <span class="badge"
                              th:classappend="${ia.statutIA == 'gestante' ? 'badge-niveau badge-niveau-info' : (ia.statutIA == 'echouee' ? 'badge-niveau badge-niveau-danger' : 'badge-niveau badge-niveau-warning')}"
                              th:text="${ia.statutIA}"></span>
                    </td>
                    <td style="text-align:center;display:flex;justify-content:center;gap:6px;">
                        <button type="button" class="btn btn-sm btn-primary"
                                th:onclick="'openModal(' + ${ia.id} + ')'">
                            <i class="fas fa-pen"></i>
                        </button>
                        <form th:action="@{/reproduction/supprimer/{reproductionId}(reproductionId=${ia.id})}"
                              method="post" style="display:inline;"
                              onsubmit="return confirm('Supprimer cette IA ?')">
                            <button type="submit" class="btn btn-sm" style="border:1px solid #DC2626;color:#DC2626;">
                                <i class="fas fa-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                 <tr th:if="${#lists.isEmpty(historique)}">
                     <td colspan="6" class="text-center" style="padding:32px;color:#9CA3AF;">
                         Aucune insémination enregistrée pour cette vache.
                     </td>
                 </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="modalOverlay" class="hidden">
        <div class="modal-card">
            <h2 style="margin-top:0;margin-bottom:20px;font-size:1.1rem;font-weight:700;">Mettre à jour le statut</h2>
            <form id="statusForm" method="post" class="form-grid" style="grid-template-columns:1fr;">
                <div class="form-group">
                    <label>Nouveau statut</label>
                    <select id="statut" name="statut" required>
                        <option value="en_attente">En attente</option>
                        <option value="gestante">Gestante</option>
                        <option value="echouee">Échouée</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date de confirmation (optionnel)</label>
                    <input type="date" id="dateConfirmation" name="dateConfirmation">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Annuler</button>
                    <button type="submit" class="btn btn-primary">Confirmer</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function openModal(iaId) {
            document.getElementById('modalOverlay').classList.remove('hidden');
            document.getElementById('statusForm').action = '/reproduction/update-statut/' + iaId;
        }
        function closeModal() {
            document.getElementById('modalOverlay').classList.add('hidden');
        }
        document.getElementById('modalOverlay').addEventListener('click', function (event) {
            if (event.target === this) closeModal();
        });
    </script>

</div>
</body>
</html>
