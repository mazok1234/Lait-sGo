<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inséminations en Attente</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            background: #f2f2f2;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            background: white;
            padding: 30px 35px;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-weight: 400;
            color: #333;
            font-size: 24px;
        }

        .btn {
            padding: 8px 16px;
            border: 1px solid #aaa;
            border-radius: 4px;
            background: #eee;
            color: #333;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: #ddd;
        }

        .btn-primary {
            background: #4CAF50;
            border-color: #4CAF50;
            color: white;
        }

        .btn-primary:hover {
            background: #45a049;
        }

        .alert {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background: #f9f9f9;
        }

        .alert-info {
            background: #e6f7e6;
            border-color: #b2d8b2;
            color: #2d6a2d;
        }

        .alert-error {
            background: #fde8e8;
            border-color: #f5c6cb;
            color: #721c24;
        }

        .table-responsive {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f0f0f0;
        }

        th {
            padding: 12px 10px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 1px solid #ddd;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid #ddd;
            color: #333;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            background: #fff3cd;
            color: #856404;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state p {
            font-size: 16px;
            margin-bottom: 20px;
        }

        .action-buttons {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 4px 10px;
            font-size: 12px;
            border: 1px solid #aaa;
            border-radius: 3px;
            background: #eee;
            color: #333;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-small:hover {
            background: #ddd;
        }

        .btn-view {
            background: #2196F3;
            border-color: #2196F3;
            color: white;
        }

        .btn-view:hover {
            background: #0b7dda;
        }

        .btn-update {
            background: #17a2b8;
            border-color: #17a2b8;
            color: white;
        }

        .btn-update:hover {
            background: #138496;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #f7f7f7;
            padding: 15px 25px;
            border-radius: 4px;
            border-left: 3px solid #4CAF50;
        }

        .stat-card h3 {
            font-size: 14px;
            color: #555;
            font-weight: 400;
        }

        .stat-card .number {
            font-size: 28px;
            font-weight: 600;
            color: #333;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- En-tête -->
        <div class="header">
            <h1>⏳ Inséminations en Attente</h1>
            <div>
                <a href="/reproduction/nouvelle" class="btn">➕ Nouvelle IA</a>
                <a href="/reproduction/alertes" class="btn">🔔 Alertes vêlage</a>
            </div>
        </div>

        <!-- Statistique simple -->
        <div class="stats">
            <div class="stat-card">
                <h3>Total en attente</h3>
                <div class="number" th:text="${iaEnAttente.size()}">0</div>
            </div>
        </div>

        <!-- Messages -->
        <div th:if="${success}" class="alert alert-info" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <!-- Tableau -->
        <div class="table-responsive">
            <div th:if="${iaEnAttente.isEmpty()}" class="empty-state">
                <p>🎉 Aucune insémination en attente actuellement</p>
                <a href="/reproduction/nouvelle" class="btn">Enregistrer une nouvelle IA</a>
            </div>

            <div th:unless="${iaEnAttente.isEmpty()}">
                <table>
                    <thead>
                        <tr>
                            <th>Vache</th>
                            <th>Date d'IA</th>
                            <th>Semence</th>
                            <th>Inséminateur</th>
                            <th>Type d'IA</th>
                            <th>Statut</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                   <tbody>
    <tr th:each="ia : ${iaEnAttente}">
        <td th:text="${ia.numeroBoucleVache}"></td>
        <td th:text="${ia.dateIA}"></td>
        <td th:text="${ia.semence}"></td>
        <td th:text="${ia.inséminateur}"></td>  
        <td th:text="${ia.typeInjection}"></td>
        <td><span class="badge" th:text="${ia.statutIA}"></span></td>
        <td>
            <div class="action-buttons">
                <a th:href="@{/reproduction/historique/{vacheId}(vacheId=${ia.vacheId})}" 
                   class="btn-small btn-view">👁️ Voir historique</a>
                <button type="button" class="btn-small btn-update"
                        th:onclick="'updateStatus(' + ${ia.id} + ')'">
                    ✏️ Mettre à jour
                </button>
            </div>
        </td>
    </tr>
</tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Script pour mise à jour du statut -->
    <script>
        function updateStatus(iaId) {
            var newStatus = prompt("Nouveau statut (gestante/echouee):");
            if (newStatus && (newStatus === 'gestante' || newStatus === 'echouee')) {
                var form = document.createElement('form');
                form.method = 'POST';
                form.action = '/reproduction/update-statut/' + iaId;

                var input1 = document.createElement('input');
                input1.type = 'hidden';
                input1.name = 'statut';
                input1.value = newStatus;
                form.appendChild(input1);

                var input2 = document.createElement('input');
                input2.type = 'hidden';
                input2.name = 'dateConfirmation';
                input2.value = '';  // facultatif
                form.appendChild(input2);

                // CSRF (si besoin)
                var csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
                if (csrfToken) {
                    var csrfInput = document.createElement('input');
                    csrfInput.type = 'hidden';
                    csrfInput.name = '_csrf';
                    csrfInput.value = csrfToken;
                    form.appendChild(csrfInput);
                }

                document.body.appendChild(form);
                form.submit();
            } else if (newStatus) {
                alert("Statut invalide. Veuillez entrer 'gestante' ou 'echouee'.");
            }
        }
    </script>
</body>

</html>
