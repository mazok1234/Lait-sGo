<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{index :: layout(~{::mainContent})}">
<head>
    <title>Inséminations en attente</title>
</head>
<body>
<div th:fragment="mainContent" class="page-content">

    <div class="page-header">
        <h1 class="page-title">Inséminations en attente</h1>
        <p class="page-subtitle">IA dont le résultat de gestation n'est pas encore confirmé</p>
    </div>

    <div th:if="${success}" class="flash flash-success" style="margin-bottom:20px;">
        <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="flash flash-error" style="margin-bottom:20px;">
        <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
    </div>

    <div class="stats-grid stats-grid-3">
        <div class="card kpi-card">
            <div class="card-icon"><i class="fas fa-hourglass-half icon-warning"></i></div>
            <div>
                <div class="card-label">Total en attente</div>
                <div class="card-value" th:text="${iaEnAttente.size()}">0</div>
            </div>
        </div>
    </div>

    <div class="card card-table">
        <div class="card-header" style="justify-content:space-between;">
            <span class="card-title">Inséminations en attente</span>
            <a th:href="@{/reproduction/nouvelle}" class="btn btn-primary">
                <i class="fas fa-plus"></i> Nouvelle IA
            </a>
        </div>

        <div class="card-body">
            <table class="table">
                <thead>
                <tr>
                    <th>Vache</th>
                    <th>Date d'IA</th>
                    <th>Semence</th>
                    <th>Inséminateur</th>
                    <th>Type d'IA</th>
                    <th>Statut</th>
                    <th style="text-align:center;">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="ia : ${iaEnAttente}">
                    <td th:text="${ia.numeroBoucleVache}">-</td>
                    <td th:text="${ia.dateIA}">-</td>
                    <td th:text="${ia.semence}">-</td>
                    <td th:text="${ia.inséminateur}">-</td>
                    <td th:text="${ia.typeInjection}">-</td>
                    <td><span class="badge badge-niveau badge-niveau-warning" th:text="${ia.statutIA}"></span></td>
                    <td style="text-align:center;display:flex;justify-content:center;gap:6px;">
                        <a th:href="@{/reproduction/historique/{vacheId}(vacheId=${ia.vacheId})}"
                           class="btn btn-sm" style="border:1px solid #007AFF;color:#007AFF;">
                            <i class="fas fa-eye"></i>
                        </a>
                        <button type="button" class="btn btn-sm btn-primary"
                                th:onclick="'updateStatus(' + ${ia.id} + ')'">
                            <i class="fas fa-pen"></i>
                        </button>
                    </td>
                </tr>
                <tr th:if="${iaEnAttente.isEmpty()}">
                    <td colspan="7" class="text-center" style="padding:32px;color:#9CA3AF;">
                        Aucune insémination en attente actuellement.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function updateStatus(iaId) {
            var newStatus = prompt("Nouveau statut (gestante/echouee):");
            if (newStatus && (newStatus === 'gestante' || newStatus === 'echouee')) {
                var form = document.createElement('form');
                form.method = 'POST';
                form.action = '/reproduction/update-statut/' + iaId;

                var input1 = document.createElement('input');
                input1.type = 'hidden';
                input1.name = 'statut';
                input1.value = newStatus;
                form.appendChild(input1);

                document.body.appendChild(form);
                form.submit();
            } else if (newStatus) {
                alert("Statut invalide. Veuillez entrer 'gestante' ou 'echouee'.");
            }
        }
    </script>

</div>
</body>
</html>
