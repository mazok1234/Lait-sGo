<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{index :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <h1>Dashboard</h1>

  <div class="counters">
    <div class="counter">
      <strong th:text="${compteurs.alertesActives}">0</strong>
      <span>Alertes actives</span>
    </div>
    <div class="counter">
      <strong th:text="${compteurs.gestationsEnCours}">0</strong>
      <span>Gestations en cours</span>
    </div>
    <div class="counter">
      <strong th:text="${compteurs.vachesEnLactation}">0</strong>
      <span>Vaches en lactation</span>
    </div>
  </div>

  <div class="section-head">
    <h2>Suivi des chaleurs</h2>
    <div class="controls">
      <form th:action="@{/reproduction}" method="get" class="heat-filters">
        <label>
          Mois
          <input type="number" name="mois" min="1" max="12" th:value="${selectedMonth}" />
        </label>
        <label>
          Année
          <input type="number" name="annee" min="2000" max="2100" th:value="${selectedYear}" />
        </label>
        <label>
          Vache
          <select name="vacheId">
            <option th:value="''" th:text="'Toutes les vaches'" th:selected="${selectedVacheId == null}"></option>
            <option th:each="v : ${vaches}"
                    th:value="${v.id}"
                    th:text="${v.numeroBoucle}"
                    th:selected="${v.id == selectedVacheId}">
            </option>
          </select>
        </label>
        <button class="primary" type="submit">Filtrer</button>
      </form>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Vache</th>
        <th>Numéro boucle</th>
        <th>Date de chaleur</th>
        <th>Origine</th>
        <th>Statut</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="ligne : ${chaleurs}">
        <td th:text="${ligne.numeroBoucle}">Bella</td>
        <td th:text="${ligne.vacheId}">1</td>
        <td th:text="${ligne.dateChaleur}">2026-06-22</td>
        <td th:text="${ligne.origine}">Prochaine chaleur</td>
        <td th:text="${ligne.statut}">Chaleur</td>
      </tr>
      <tr th:if="${#lists.isEmpty(chaleurs)}">
        <td colspan="5">Aucune chaleur trouvée pour ce filtre.</td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
