<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{index :: layout(~{::content})}">
<body>
<div th:fragment="content">
  <h1>Dashboard</h1>

  <div class="filters">
    <input type="text" placeholder="Rechercher une vache" th:name="recherche">
    <select th:name="race">
      <option>Toutes les races</option>
      <option>Prim'Holstein</option>
      <option>Normande</option>
      <option>Montbéliarde</option>
    </select>
    <input type="date" th:name="dateDebut" value="2026-06-22">
    <input type="date" th:name="dateFin" value="2026-06-28">
  </div>

  <div class="section-head">
    <h2>Suivi des chaleurs</h2>
    <div class="controls">
      <select th:name="vache">
        <option>Toutes les vaches</option>
        <option th:each="v : ${vaches}" th:text="${v.nom} + ' ' + ${v.numero}" th:value="${v.id}">Bella n°014</option>
      </select>
      <button class="primary" id="edit-btn" type="button">Modifier</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Vache</th>
        <th class="day" th:each="jour : ${jours}" th:text="${jour}">Lun 22</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="ligne : ${suiviChaleurs}">
        <td>
          <div class="cow-name" th:text="${ligne.vache.nom}">Bella</div>
          <div class="cow-id" th:text="${ligne.vache.numero}">n°014</div>
        </td>
        <td class="day" th:each="statut : ${ligne.statutsParJour}">
          <span th:if="${statut == 'HEAT'}" class="badge heat">Chaleur</span>
          <span th:if="${statut == 'INSEM'}" class="badge insem">IA prévue</span>
          <span th:if="${statut == 'NONE'}" class="badge none">–</span>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="pagination">
    <button aria-label="Page précédente" type="button" th:disabled="${page == 1}">‹</button>
    <span th:text="'Page ' + ${page} + ' sur ' + ${totalPages}">Page 1 sur 3</span>
    <button aria-label="Page suivante" type="button" th:disabled="${page == totalPages}">›</button>
  </div>
</div>

<script>
  document.getElementById('edit-btn')?.addEventListener('click', () => {
    alert('Mode édition à connecter à votre backend.');
  });
</script>
</body>
</html>
