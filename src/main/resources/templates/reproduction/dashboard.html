<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <div th:fragment="reproductionContent">
        
        <style>
            .reproduction-container { display: flex; flex-direction: column; gap: 25px; width: 100%; color: #2d3748; }
            
            /* Sous-menu avec le bouton Dashboard demandé */
            .submenu-bar { display: flex; gap: 10px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 10px; }
            .btn-submenu { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; background-color: #ebf8ff; color: #2b6cb0; border: 1px solid #bee3f8; border-radius: 6px; font-weight: 600; text-decoration: none; font-size: 0.95rem; transition: all 0.2s; }
            .btn-submenu:hover { background-color: #cee9ff; }
            .btn-submenu i { font-size: 0.9rem; }

            /* KPIs supérieurs */
            .kpi-container { display: flex; gap: 20px; }
            .kpi-card { flex: 1; background: #ffffff; padding: 20px; border-radius: 10px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
            .kpi-card h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; color: #718096; margin-bottom: 6px; font-weight: 700; }
            .kpi-card .value { font-size: 1.8rem; font-weight: 800; color: #1a202c; }

            /* Zone de recherche / Filtres */
            .section-header { background: #ffffff; padding: 20px; border-radius: 10px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
            .section-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 15px; color: #1a202c; text-transform: lowercase; }
            .filter-form { display: flex; gap: 15px; align-items: flex-end; }
            .filter-group { display: flex; flex-direction: column; gap: 6px; }
            .filter-group label { font-size: 0.85rem; font-weight: 600; color: #4a5568; text-transform: lowercase; }
            .filter-group select, .filter-group input { padding: 8px 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 0.9rem; background-color: #fff; width: 200px; color: #2d3748; }
            .btn-submit { padding: 8px 16px; background-color: #3182ce; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 0.9rem; transition: background 0.2s; }
            .btn-submit:hover { background-color: #2b6cb0; }

            /* Calendrier hebdomadaire */
            .calendar-table { width: 100%; border-collapse: separate; border-spacing: 0; background: #ffffff; border-radius: 10px; overflow: hidden; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
            .calendar-table th, .calendar-table td { border-right: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; padding: 12px; width: 14.28%; }
            .calendar-table th:last-child, .calendar-table td:last-child { border-right: none; }
            .calendar-table tr:last-child td { border-bottom: none; }
            .calendar-table th { background-color: #f7fafc; font-weight: 700; color: #4a5568; text-align: left; font-size: 0.9rem; line-height: 1.4; }
            .calendar-table td { height: 120px; vertical-align: top; }
            
            /* Événements (Bandes du croquis) */
            .event-badge { display: block; background-color: #f0fff4; border-left: 4px solid #38a169; color: #22543d; padding: 6px 8px; margin-top: 6px; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
            .event-badge.velage { background-color: #fffaf0; border-left-color: #dd6b20; color: #7b341e; }
            
            /* Pagination */
            .calendar-nav { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 5px; }
            .nav-link { text-decoration: none; color: #3182ce; font-weight: 800; font-size: 1.3rem; }
            .nav-label { font-size: 0.9rem; font-weight: 600; color: #718096; }
        </style>

        <div class="reproduction-container">
            
            <div class="submenu-bar">
                <a href="/reproduction" class="btn-submenu">
                    <i class="fas fa-columns"></i>
                    <span>Dashboard</span>
                </a>
            </div>
            
            <div class="kpi-container">
                <div class="kpi-card">
                    <h3>taux de réussite des ia</h3>
                    <div class="value" th:text="${tauxReussiteIA} + ' %'">0.0 %</div>
                </div>
                <div class="kpi-card">
                    <h3>attente contrôle gestation</h3>
                    <div class="value" th:text="${enAttenteGestation}">0</div>
                </div>
                <div class="kpi-card">
                    <h3>alertes reproduction</h3>
                    <div class="value" style="color: #e53e3e;">0</div>
                </div>
            </div>

            <div class="section-header">
                <div class="section-title">suivi des chaleur</div>
                <form action="/reproduction" method="get" class="filter-form">
                    <div class="filter-group">
                        <label>vache</label>
                        <select name="vacheId">
                            <option value="">Toutes les vaches</option>
                            <option th:each="v : ${vaches}" 
                                    th:value="${v.id}" 
                                    th:text="${v.numeroBoucle}"
                                    th:selected="${v.id == vacheIdSelected}"></option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>mois</label>
                        <input type="date" name="targetDate" th:value="${currentDate}">
                    </div>
                    <button type="submit" class="btn-submit">Filtrer</button>
                </form>
            </div>

            <table class="calendar-table">
                <thead>
                    <tr>
                        <th>Lun <br><span th:text="${#temporals.format(startOfWeek, 'dd/MM')}"></span></th>
                        <th>Mar <br><span th:text="${#temporals.format(startOfWeek.plusDays(1), 'dd/MM')}"></span></th>
                        <th>Mer <br><span th:text="${#temporals.format(startOfWeek.plusDays(2), 'dd/MM')}"></span></th>
                        <th>Jeu <br><span th:text="${#temporals.format(startOfWeek.plusDays(3), 'dd/MM')}"></span></th>
                        <th>Ven <br><span th:text="${#temporals.format(startOfWeek.plusDays(4), 'dd/MM')}"></span></th>
                        <th>Sam <br><span th:text="${#temporals.format(startOfWeek.plusDays(5), 'dd/MM')}"></span></th>
                        <th>Dim <br><span th:text="${#temporals.format(startOfWeek.plusDays(6), 'dd/MM')}"></span></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td th:each="dayOffset : ${#numbers.sequence(0, 6)}" th:with="dayDate=${startOfWeek.plusDays(dayOffset)}">
                            <div th:each="event : ${events}">
                                <div th:if="${event.dateIa != null && event.dateIa.equals(dayDate)}" class="event-badge">
                                    <span>Vache </span><strong th:text="${event.vache.numeroBoucle}"></strong><br>
                                    <span>Insémination (IA)</span>
                                </div>
                                <div th:if="${event.dateVelagePrevu != null && event.dateVelagePrevu.equals(dayDate)}" class="event-badge velage">
                                    <span>Vache </span><strong th:text="${event.vache.numeroBoucle}"></strong><br>
                                    <span>Vêlage prévu ⏳</span>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="calendar-nav">
                <a th:href="@{/reproduction(vacheId=${vacheIdSelected}, targetDate=${currentDate.minusWeeks(1)})}" class="nav-link">🡨</a>
                <span class="nav-label">semaine</span>
                <a th:href="@{/reproduction(vacheId=${vacheIdSelected}, targetDate=${currentDate.plusWeeks(1)})}" class="nav-link">🡪</a>
            </div>

        </div>
    </div>

</body>
</html>
