<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alertes vêlage</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: sans-serif;
            background: #f2f2f2;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 40px auto;
            background: white;
            padding: 30px 35px;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .header h1 {
            font-weight: 400;
            color: #333;
            font-size: 24px;
        }
        .btn {
            padding: 8px 16px;
            border: 1px solid #aaa;
            border-radius: 4px;
            background: #eee;
            color: #333;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { background: #ddd; }
        .table-responsive {
            overflow-x: auto;
            margin-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        thead {
            background: #f0f0f0;
        }
        th {
            padding: 12px 10px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 1px solid #ddd;
        }
        td {
            padding: 12px 10px;
            border-bottom: 1px solid #ddd;
            color: #333;
        }
        tr:hover {
            background: #f9f9f9;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-urgent {
            background: #f8d7da;
            color: #721c24;
        }
        .badge-attention {
            background: #fff3cd;
            color: #856404;
        }
        .badge-info {
            background: #d1ecf1;
            color: #0c5460;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        .empty-state p {
            font-size: 16px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔔 Alertes vêlage</h1>
            <div>
                <a href="/reproduction/nouvelle" class="btn">➕ Nouvelle IA</a>
                <a href="/reproduction/en-attente" class="btn">⏳ En attente</a>
            </div>
        </div>

        <div class="table-responsive">
            <div th:if="${alertes.isEmpty()}" class="empty-state">
                <p>✅ Aucune alerte de vêlage à venir.</p>
                <p>Toutes les gestantes sont suivies.</p>
            </div>

            <div th:unless="${alertes.isEmpty()}">
                <table>
                    <thead>
                        <tr>
                            <th>Vache</th>
                            <th>Date IA</th>
                            <th>Vêlage prévu</th>
                            <th>Jours restants</th>
                            <th>Urgence</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="a : ${alertes}">
                            <td th:text="${a.numeroBoucle}"></td>
                            <td th:text="${a.dateIA}"></td>
                            <td th:text="${a.dateVelagePrevue}"></td>
                            <td th:text="${a.joursRestants} + ' jours'"></td>
                            <td>
                                <span class="badge" 
                                      th:classappend="${a.niveauUrgence == 'urgent' ? 'badge-urgent' : 
                                                      a.niveauUrgence == 'attention' ? 'badge-attention' : 
                                                      'badge-info'}"
                                      th:text="${a.niveauUrgence}">
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Petit lien retour (facultatif) -->
        <div style="margin-top:20px; text-align:center; font-size:12px; color:#aaa;">
            <a href="/" style="color:#aaa; text-decoration:none;">← Retour à l'accueil</a>
        </div>
    </div>
</body>
</html>
