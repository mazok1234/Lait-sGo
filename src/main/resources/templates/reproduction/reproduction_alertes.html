<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{index :: layout(~{::mainContent})}">
<head>
    <title>Alertes vêlage</title>
</head>
<body>
<div th:fragment="mainContent" class="page-content">

    <div class="page-header">
        <h1 class="page-title">Alertes vêlage</h1>
        <p class="page-subtitle">Vêlages prévus pour les vaches gestantes</p>
    </div>

    <div class="card card-table">
        <div class="card-header">
            <span class="card-title">Vêlages à venir</span>
        </div>
        <div class="card-body">
            <table class="table">
                <thead>
                <tr>
                    <th>Vache</th>
                    <th>Date IA</th>
                    <th>Vêlage prévu</th>
                    <th>Jours restants</th>
                    <th>Urgence</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${alertes}">
                    <td th:text="${a.numeroBoucle}">-</td>
                    <td th:text="${a.dateIA}">-</td>
                    <td th:text="${a.dateVelagePrevue}">-</td>
                    <td th:text="${a.joursRestants} + ' jours'">-</td>
                    <td>
                        <span class="badge"
                              th:classappend="${a.niveauUrgence == 'urgent' ? 'badge-niveau badge-niveau-danger' : (a.niveauUrgence == 'attention' ? 'badge-niveau badge-niveau-warning' : 'badge-niveau badge-niveau-info')}"
                              th:text="${a.niveauUrgence}">
                        </span>
                    </td>
                </tr>
                <tr th:if="${alertes.isEmpty()}">
                    <td colspan="5" class="text-center" style="padding:32px;color:#9CA3AF;">
                        <i class="fas fa-check-circle" style="color:#059669;opacity:0.5;"></i><br>
                        Aucune alerte de vêlage à venir. Toutes les gestantes sont suivies.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
