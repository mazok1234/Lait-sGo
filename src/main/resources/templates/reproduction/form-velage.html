<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{index :: layout(~{::mainContent})}">
<head>
    <title>Déclarer un vêlage</title>
</head>
<body>
<div th:fragment="mainContent" class="page-content">

    <div class="page-header">
        <h1 class="page-title">Déclarer un vêlage</h1>
        <p class="page-subtitle">Enregistrer le vêlage réel d'une vache gestante</p>
    </div>

    <div th:if="${message}" class="flash flash-success" style="margin-bottom:20px;">
        <i class="fas fa-check-circle"></i> <span th:text="${message}"></span>
    </div>

    <div class="cheptel-wrapper">
        <div class="card" th:if="${!#lists.isEmpty(reproductionsGestantes)}">
            <div class="card-header">
                <span class="card-title">Informations du vêlage</span>
            </div>
            <div class="card-body">
                <form method="post" th:action="@{/reproduction/velage}" class="form-grid">

                    <div class="form-group">
                        <label>Vache gestante</label>
                        <select id="reproductionId" name="reproductionId" required>
                            <option value="">Sélectionner une vache</option>
                            <option th:each="reproduction : ${reproductionsGestantes}"
                                    th:value="${reproduction.id}"
                                    th:text="${reproduction.numeroBoucle + ' - IA du ' + #temporals.format(reproduction.dateIa, 'dd/MM/yyyy')}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Date réelle du vêlage</label>
                        <input id="dateVelageReel" type="date" name="dateVelageReel" required>
                    </div>

                    <div class="form-group">
                        <label>Sexe du veau</label>
                        <select id="sexeVeau" name="sexeVeau" required>
                            <option value="">Sélectionner</option>
                            <option value="F">Femelle</option>
                            <option value="M">Mâle</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <div class="form-actions">
                            <a th:href="@{/reproduction}" class="btn btn-outline">Annuler</a>
                            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Enregistrer</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card" th:if="${#lists.isEmpty(reproductionsGestantes)}">
            <div class="card-body text-center" style="padding:32px;color:#9CA3AF;">
                Aucune gestation confirmée en attente de vêlage.
            </div>
        </div>
    </div>

</div>
</body>
</html>
