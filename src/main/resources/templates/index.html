<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="layout (content)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lait's Go</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>

<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fas fa-cow"></i>
                <span>Lait's Go</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <ul>

                <li sec:authorize="hasRole('ADMIN')">
                    <a href="/admin">
                        <i class="fas fa-user-shield"></i>
                        <span>Administration</span>
                    </a>
                </li>
                <li>
                    <a href="/cheptel">
                        <i class="fas fa-paw"></i>
                        <span>Cheptel</span>
                    </a>
                </li>
                <li>
                    <a href="/productions">
                        <i class="fas fa-chart-bar"></i>
                        <span>Production</span>
                    </a>
                </li>
                <li class="has-submenu" data-submenu-paths="/reproduction">

                    <a href="#" class="submenu-toggle">
                        <div style="display:flex;align-items:center;gap:12px;">
                            <i class="fas fa-heart"></i>
                            <span>Reproduction</span>
                        </div>

                        <i class="fas fa-chevron-down submenu-arrow"></i>
                    </a>

                    <ul class="submenu">
                        <li>
                            <a href="/reproduction">
                                <i class="fas fa-chart-pie"></i>
                                <span>Dashboard</span>
                            </a>
                        </li>

                        <li>
                            <a href="/reproduction/en-attente">
                                <i class="fas fa-hourglass-half"></i>
                                <span>IA en attente</span>
                            </a>
                        </li>

                        <li>
                            <a href="/reproduction/alertes">
                                <i class="fas fa-bell"></i>
                                <span>Alertes vêlage</span>
                            </a>
                        </li>
                    </ul>

                </li>
                <li class="has-submenu" data-submenu-paths="/traitements,/vaccins">

                    <a href="#" class="submenu-toggle">
                        <div style="display:flex;align-items:center;gap:12px;">
                            <i class="fas fa-notes-medical"></i>
                            <span>Santé</span>
                        </div>

                        <i class="fas fa-chevron-down submenu-arrow"></i>
                    </a>

                    <ul class="submenu">
                        <li>
                            <a href="/traitements">
                                <i class="fas fa-pills"></i>
                                <span>Traitements</span>
                            </a>
                        </li>

                        <li>
                            <a href="/vaccins">
                                <i class="fas fa-syringe"></i>
                                <span>Vaccination</span>
                            </a>
                        </li>
                    </ul>

                </li>
                <li class="has-submenu" data-submenu-paths="/aliments,/types-aliments,/mouvementsAlim,/rations,/affectations-rations">

                    <a href="#" class="submenu-toggle">
                        <div style="display:flex;align-items:center;gap:12px;">
                            <i class="fas fa-apple-alt"></i>
                            <span>Alimentation</span>
                        </div>

                        <i class="fas fa-chevron-down submenu-arrow"></i>
                    </a>

                    <ul class="submenu">
                        <li>
                            <a href="/aliments">
                                <i class="fas fa-apple-alt"></i>
                                <span>Aliments</span>
                            </a>
                        </li>

                        <li>
                            <a href="/mouvementsAlim">
                                <i class="fas fa-exchange-alt"></i>
                                <span>Mouvements</span>
                            </a>
                        </li>

                        <li>
                            <a href="/rations">
                                <i class="fas fa-balance-scale"></i>
                                <span>Rations</span>
                            </a>
                        </li>
                    </ul>

                </li>
                <li>
                    <a href="/alertes">
                        <i class="fas fa-exclamation-triangle"></i>
                        <span>Alertes</span>
                    </a>
                </li>
                <li>
                    <a href="/vente/liste">
                        <i class="fas fa-shopping-cart"></i>
                        <span>Ventes</span>
                    </a>
                </li>

            </ul>
        </nav>
        <div class="sidebar-footer">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Déconnexion</span>
                </button>
            </form>
        </div>
    </aside>

    <main class="main-content">

        <header class="header">
            <div class="header-left">
                <button class="sidebar-toggle" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <div class="header-right">
                <div class="user-profile">
                    <div class="avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <span class="user-name" th:text="${currentUserNom}">Admin</span>
                </div>
            </div>
        </header>

        <div id="content" class="page-content" th:replace="${content}">
        </div>

    </main>

    <script>

        var currentPath = window.location.pathname;
        document.querySelectorAll(".has-submenu").forEach(item => {
            var paths = (item.dataset.submenuPaths || "").split(",").filter(Boolean);
            if (paths.some(p => currentPath.startsWith(p))) {
                item.classList.add("open");
            }
        });

        document.querySelectorAll(".submenu-toggle").forEach(toggle => {
            toggle.addEventListener("click", function (e) {
                e.preventDefault();
                if (this.parentElement.classList.contains("open")) {
                    this.parentElement.classList.remove("open");
                } else {
                    document.querySelectorAll(".has-submenu").forEach(item => item.classList.remove("open"));
                    this.parentElement.classList.add("open");
                }
            });
        });
    </script>


</body>

</html>
