<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Fragment réutilisable : injecte la sidebar Alimentation dans toutes les pages /aliments
    Usage: <div th:replace="~{fragments/alimentation_sidebar :: sidebar(activeItem)}"></div>
    activeItem : 'alimentation' | 'types' | 'mouvements'
-->
<script th:fragment="sidebarScript(activeItem)" th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
        var nav = document.querySelector('.sidebar-nav ul');
        if (!nav) return;
        var active = /*[[${activeItem}]]*/ 'alimentation';
        nav.innerHTML =
            '<li class="' + (active === 'alimentation' ? 'active' : '') + '">' +
                '<a href="/aliments"><i class="fas fa-apple-alt"></i><span>Alimentation</span></a>' +
            '</li>' +
            '<li class="' + (active === 'types' ? 'active' : '') + '">' +
                '<a href="/types-aliments"><i class="fas fa-tags"></i><span>Types d\'aliments</span></a>' +
            '</li>' +
            '<li class="' + (active === 'mouvements' ? 'active' : '') + '">' +
                '<a href="/mouvementsAlim"><i class="fas fa-exchange-alt"></i><span>Mouvements</span></a>' +
            '</li>' +
            '<li>' +
                '<a href="/rations"><i class="fas fa-balance-scale"></i><span>Rations</span></a>' +
            '</li>';
    });
</script>

</body>
</html>
