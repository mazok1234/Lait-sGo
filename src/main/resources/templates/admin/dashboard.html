<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{index :: layout(~{::mainContent})}">

<head>
    <title>Espace admin</title>
</head>

<body>
    <div th:fragment="mainContent" class="page-content">

        <div class="page-header">
            <h1 class="page-title">Dashboard Administration</h1>
            <p class="page-subtitle">Vue d'ensemble de la ferme</p>
        </div>

        <div class="card" style="padding:12px 16px;margin-bottom:14px;">
            <form th:action="@{/admin}" method="get" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;">
                <span style="font-weight:600;color:#374151;">Periode</span>
                <input type="date" name="dateDe" th:value="${dateDe}" class="filter-search" style="min-width:170px;">
                <span style="color:#6B7280;font-size:0.85rem;">a</span>
                <input type="date" name="dateA" th:value="${dateA}" class="filter-search" style="min-width:170px;">
                <button type="submit" class="btn btn-sm" style="border:1px solid #007AFF;color:#007AFF;">Filtrer</button>
                <a th:href="@{/admin}" class="btn btn-sm" style="border:1px solid #D1D5DB;color:#1A1A2E;">Reinitialiser</a>
            </form>
        </div>

        <div class="stats-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
            <div class="card stat-card">
                <div class="stat-icon" style="background-color:#EFF6FF;color:#007AFF;">
                    <i class="fas fa-paw"></i>
                </div>
                <div class="stat-body">
                    <div class="stat-label">Vaches</div>
                    <div class="stat-value" th:text="${nbVaches}">0</div>
                </div>
            </div>
            <!-- <div class="card stat-card">
                <div class="stat-icon" style="background-color:#F3E8FF;color:#9333EA;">
                    <i class="fas fa-users"></i>
                </div>
                <div class="stat-body">
                    <div class="stat-label">Éleveurs</div>
                    <div class="stat-value" th:text="${nbEleveurs}">0</div>
                </div>
            </div> -->
            <div class="card stat-card">
                <div class="stat-icon" style="background-color:#ECFDF5;color:#059669;">
                    <i class="fas fa-balance-scale"></i>
                </div>
                <div class="stat-body">
                    <div class="stat-label">Rations</div>
                    <div class="stat-value" th:text="${nbRations}">0</div>
                </div>
            </div>
            <div class="card stat-card">
                <div class="stat-icon" style="background-color:#E0F2FE;color:#0284C7;">
                    <i class="fas fa-tint"></i>
                </div>
                <div class="stat-body">
                    <div class="stat-label">Lait Produit (L)</div>
                    <div class="stat-value" th:text="${#numbers.formatDecimal(quantiteLait, 1, 2)}">0</div>
                </div>
            </div>
            <div class="card stat-card">
                <div class="stat-icon" style="background-color:#FFFBEB;color:#D97706;">
                    <i class="fas fa-coins"></i>
                </div>
                <div class="stat-body">
                    <div class="stat-label">Total Ventes (Ar)</div>
                    <div class="stat-value" th:text="${#numbers.formatDecimal(totalVentes, 1, 2)}">0</div>
                </div>
            </div>
            <a class="card stat-card" th:href="@{/alertes}" style="text-decoration:none;color:inherit;">
                <div class="stat-icon" style="background-color:#FEE2E2;color:#DC2626;">
                    <i class="fas fa-bell"></i>
                </div>
                <div class="stat-body">
                    <div class="stat-label">Alertes actives</div>
                    <div class="stat-value" th:text="${alertesNonAcquittees}">0</div>
                </div>
            </a>
        </div>

    </div>
</body>

</html>
