<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{index :: layout(~{::mainContent})}">
<head>
    <title>Liste des vaches</title>
</head>
<body>
<div th:fragment="mainContent" class="page-content">
    <div class="cheptel-wrapper">
        <div class="cheptel-header">
            <h1><i class="fas fa-cow" style="color:#2f6ed4"></i> Liste des vaches</h1>
<a th:href="@{/cheptel/vaches/nouveau}" class="btn btn-primary"><i class="fas fa-plus"></i> Nouvelle vache</a>
        </div>

        <div class="card">
            <div class="card-body">
                <div th:if="${errorMessage}" class="card"
                     style="padding:12px 16px;margin-bottom:1.2rem;border:1px solid #f6c6c0;background:#fce8e6;color:#b34033;"
                     th:text="${errorMessage}"></div>

                <form th:action="@{/cheptel/vaches}" method="get" class="filter-grid">
                    <div class="filter-item">
                        <div class="label-sm"><i class="fas fa-search"></i> Recherche</div>
                        <input type="text" name="q" th:value="${param.q}" placeholder="Numéro, race, statut…">
                    </div>
                    <div class="filter-item">
                        <div class="label-sm">Race</div>
                        <select name="raceId">
                            <option value="">Toutes</option>
                            <option th:each="r : ${races}" th:value="${r.id}" th:text="${r.libelle}" th:selected="${param.raceId == r.id}">Race</option>
                        </select>
                    </div>
                    <div class="filter-item" style="display:flex;align-items:flex-end;">
                        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;"><i class="fas fa-filter"></i> Filtrer</button>
                    </div>
                </form>

                <div class="table-wrap">
                    <table th:unless="${#lists.isEmpty(vaches)}">
                        <thead>
                            <tr><th>Référence</th><th>Race</th><th>Vie</th><th>Repro</th><th>Lactation</th><th>Santé</th><th>Surveillance</th><th>Actions</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${vaches}">
                                <td th:text="${item.vache.numeroBoucle}">#12345</td>
                                <td th:text="${item.vache.race != null ? item.vache.race.libelle : ''}">Prim'Holstein</td>
                                <td th:text="${item.vie}">-</td>
                                <td th:text="${item.repro}">-</td>
                                <td th:text="${item.lactation}">-</td>
                                <td th:text="${item.sante}">-</td>
                                <td>
                                    <span th:classappend="${(item.vache.scoreLocomotion != null and item.vache.scoreLocomotion < 3) or (item.vache.scoreBcs != null and (item.vache.scoreBcs < 2.5 or item.vache.scoreBcs > 4.0))} ? 'alert' : 'green'">
                                        <span th:text="${(item.vache.scoreLocomotion != null and item.vache.scoreLocomotion < 3) or (item.vache.scoreBcs != null and (item.vache.scoreBcs < 2.5 or item.vache.scoreBcs > 4.0))} ? 'Surveillance' : 'Stable'">Stable</span>
                                    </span>
                                </td>
                                <td>
                                    <a th:href="@{'/cheptel/vaches/' + ${item.vache.id}}" class="action-pill"><i class="far fa-eye"></i></a>
                                    <a th:href="@{'/cheptel/vaches/' + ${item.vache.id} + '/edit'}" class="action-pill"><i class="far fa-edit"></i></a>
                                    <a th:href="@{'/cheptel/vaches/' + ${item.vache.id} + '/delete'}" class="action-pill" style="background:#fce8e6;color:#b34033;" onclick="return confirm('Supprimer cette vache ?');"><i class="far fa-trash-alt"></i></a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div th:if="${#lists.isEmpty(vaches)}" class="empty-state" style="padding:24px;">
                        <i class="fas fa-search"></i>
                        <p>Aucune vache trouvée</p>
                    </div>
                </div>

                <div class="pagination" th:unless="${#lists.isEmpty(vaches) or totalPages <= 1}">
                    <button class="btn btn-outline btn-sm" th:disabled="${page == 0}" th:onclick="'location.href=\'' + @{/cheptel/vaches(page=0, q=${param.q}, raceId=${param.raceId})} + '\''">Première</button>
                    <button class="btn btn-outline btn-sm" th:disabled="${page == 0}" th:onclick="'location.href=\'' + @{/cheptel/vaches(page=${page - 1}, q=${param.q}, raceId=${param.raceId})} + '\''">Précédente</button>
                    <span class="page-info" th:text="'Page ' + ${page + 1} + ' / ' + ${totalPages}">Page 1</span>
                    <button class="btn btn-outline btn-sm" th:disabled="${page >= totalPages - 1}" th:onclick="'location.href=\'' + @{/cheptel/vaches(page=${page + 1}, q=${param.q}, raceId=${param.raceId})} + '\''">Suivante</button>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
