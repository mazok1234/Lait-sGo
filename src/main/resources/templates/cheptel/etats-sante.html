<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{index :: layout(~{::mainContent})}">
<head>
    <title>États de santé</title>
</head>
<body>
<div th:fragment="mainContent" class="page-content">
    <div class="cheptel-wrapper">
        <div class="cheptel-header">
            <h1><i class="fas fa-notes-medical" style="color:#2f6ed4"></i> États de santé</h1>
<a th:href="@{/cheptel}" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Retour</a>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-title">Ajouter un état de santé</div>
            </div>
            <div class="card-body">
                <form th:action="@{/cheptel/etats-sante}" method="post" class="form-grid">
                    <div class="form-group">
                        <label>Code</label>
                        <input type="text" name="code" placeholder="Ex: stable" required>
                    </div>
                    <div class="form-group">
                        <label>Libellé</label>
                        <input type="text" name="libelle" placeholder="Ex: Stable" required>
                    </div>
                    <div class="form-group full-width">
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Ajouter</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-title">Liste des états de santé</div>
                <span class="badge-sub" th:text="${'· ' + #lists.size(etats) + ' états'}">· 0 états</span>
            </div>
            <div class="card-body">
                <div th:if="${#lists.isEmpty(etats)}" class="empty-state">
                    <i class="fas fa-notes-medical"></i>
                    <p>Aucun état enregistré</p>
                </div>
                <div th:unless="${#lists.isEmpty(etats)}" class="table-wrap">
                    <table>
                        <thead><tr><th>Code</th><th>Libellé</th><th style="text-align:right">Actions</th></tr></thead>
                        <tbody>
                            <tr th:each="e : ${etats}">
                                <td th:text="${e.code}">stable</td>
                                <td th:text="${e.libelle}">Stable</td>
                                <td style="text-align:right;display:flex;justify-content:flex-end;gap:.4rem;">
                                    <form th:action="@{/cheptel/etats-sante/update/{id}(id=${e.id})}" method="post" style="display:inline-flex;gap:.3rem;align-items:center;">
                                        <input type="text" name="libelle" th:value="${e.libelle}" style="padding:.3rem .5rem;border:1px solid #dce3ed;border-radius:10px;font-size:.82rem;" required>
                                        <button type="submit" class="btn btn-outline" style="padding:.3rem .7rem;font-size:.78rem;">Mettre à jour</button>
                                    </form>
                                    <a th:href="@{/cheptel/etats-sante/delete/{id}(id=${e.id})}" class="btn btn-danger-sm" onclick="return confirm('Supprimer cet état ?');">Supprimer</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
