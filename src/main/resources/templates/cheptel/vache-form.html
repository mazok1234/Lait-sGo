<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" th:replace="~{index :: layout(~{::mainContent})}">
<head>
    <title th:text="${mode == 'edit' ? 'Modifier une vache' : 'Ajouter une vache'}">Ajouter une vache</title>
</head>
<body>
<div th:fragment="mainContent" class="page-content">
    <div class="cheptel-wrapper">
        <div class="cheptel-header">
            <h1><i class="fas fa-plus-circle" style="color:#2f6ed4"></i> <span th:text="${mode == 'edit' ? 'Modifier une vache' : 'Ajouter une vache'}">Ajouter une vache</span></h1>
<a th:href="@{/cheptel}" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Retour à la liste</a>
        </div>

        <div class="card">
            <div class="card-body">
                <div th:if="${errorMessage}" class="card"
                     style="padding:12px 16px;margin-bottom:1.2rem;border:1px solid #f6c6c0;background:#fce8e6;color:#b34033;"
                     th:text="${errorMessage}"></div>

                <form th:action="${mode == 'edit'} ? @{'/cheptel/vaches/' + ${vacheId} + '/edit'} : @{/cheptel/vaches/nouveau}" method="post" class="form-grid" th:object="${vacheForm}">
                    <input th:if="${reproductionId != null}" type="hidden" name="reproductionId" th:value="${reproductionId}">
                    <div th:if="${reproductionId != null}" class="form-group full-width">
                        <div class="card" style="padding:12px 16px;border:1px solid #bcd6f6;background:#eef4fa;color:#1f3f66;">
                            <i class="fas fa-baby"></i> Ce veau confirmera le vêlage de sa mère à l'enregistrement.
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Numéro de boucle</label>
                        <input type="text" th:field="*{numeroBoucle}" required>
                    </div>
                    <div class="form-group">
                        <label>Race</label>
                        <select th:field="*{raceId}">
                            <option value="">-- Choisir --</option>
                            <option th:each="r : ${races}" th:value="${r.id}" th:text="${r.libelle}">Race</option>
                        </select>
                    </div>
                    <div class="form-group" th:if="${reproductionId != null}">
                        <label>Sexe</label>
                        <select th:field="*{sexe}">
                            <option value="M">Mâle</option>
                            <option value="F">Femelle</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Statut vie</label>
                        <select th:field="*{vieId}">
                            <option value="">-- Choisir --</option>
                            <option th:each="s : ${statutsVie}" th:value="${s.id}" th:text="${s.libelle}">Statut</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Statut reproduction</label>
                        <select th:field="*{reproId}">
                            <option value="">-- Choisir --</option>
                            <option th:each="s : ${statutsRepro}" th:value="${s.id}" th:text="${s.libelle}">Statut</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Statut lactation</label>
                        <select th:field="*{lactationId}">
                            <option value="">-- Choisir --</option>
                            <option th:each="s : ${statutsLactation}" th:value="${s.id}" th:text="${s.libelle}">Statut</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Statut santé</label>
                        <select th:field="*{santeId}">
                            <option value="">-- Choisir --</option>
                            <option th:each="s : ${statutsSante}" th:value="${s.id}" th:text="${s.libelle}">Statut</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Date de naissance</label>
                        <input type="date" th:field="*{dateNaissance}" required>
                    </div>
                    <div class="form-group">
                        <label>Poids (kg)</label>
                        <input type="number" step="0.1" th:field="*{poidsKg}">
                    </div>
                    <div class="form-group">
                        <label>Mère (optionnel)</label>
                        <select th:field="*{mereId}">
                            <option value="">-- Aucune --</option>
                            <option th:each="v : ${vachesMeres}" th:value="${v.id}" th:text="${v.numeroBoucle}">#12345</option>
                        </select>
                    </div>
                    <div class="form-group" th:unless="${reproductionId != null}">
                        <label>Score BCS (1 à 5)</label>
                        <input type="number" step="0.01" min="1" max="5" th:field="*{scoreBcs}">
                    </div>
                    <div class="form-group" th:unless="${reproductionId != null}">
                        <label>Score locomotion (1 à 5)</label>
                        <input type="number" step="1" min="1" max="5" th:field="*{scoreLocomotion}">
                    </div>
                    <div class="form-group full-width">
                        <div class="form-actions">
<a th:href="@{/cheptel}" class="btn btn-outline">Annuler</a>
                            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Enregistrer</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
