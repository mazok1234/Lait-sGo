spring.application.name=demo

# Configuration de la base de données PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/laitgo
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Stratégie DDL (Désactivée pour utiliser vos propres scripts/vues)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false

# Permettre à Hibernate d'accéder aux métadonnées JDBC pour un suivi précis des logs
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=true

# Journalisation et formatage des requêtes SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true